# ====== Default Configuration ======
# DO NOT directly modify the following parameters
# Put your own setting in config_edit_me.yaml instead.
# --------------------------------------

bot:
  # 🔁 Bot Settings
  mode: "normal"        # 挂机方式："normal"=巡逻绕圈（沿路线走，路过打怪）｜"stand"=定点驻守
                        # （站安全点打附近怪，掉出去沿回家路线走回；安全点用 F5 在录制器里标定）
  attack: "directional" # Options: "aoe_skill" "directional"
  map: "" # Please refer to config/config_data.yaml

key:
  # 🎮 Keyboard Mapping
  # Adjust the keys to match your in-game keybindings.
  #
  # Examples:
  #   - "q":      Presses key Q
  #   - "space":  Space bar
  #   - "1":      Number key 1
  #   - "ctrl":   Control key
  #   - "alt":    Alt key
  #   - "shift":  Shift key
  aoe_skill: "q"            # 💥 AoE skill (e.g., Cleric's heal or Mage's lightning)
  directional_attack: "w"   # ⚔️ Basic directional attack (e.g., Magic Claw or throwing stars)
  teleport: "e"             # 🌀 Teleport skill. Set to "" if not usable
  jump: "space"             # 🦘 Jump key
  # 🦘 跳跃冷却（秒）：按一次跳之后，这段时间内**不再**发跳跃键。
  #   为什么必须有（2026-09-13 用户实测）：
  #     没有它时，角色只要站在 jump 像素上，键盘线程**每帧**就按一次跳
  #     —— 30fps 下按 30 次/秒 = 连跳。表现是「跳上平台了还在跳，反而又跳出去了」。
  #   1.0s ≈ 一次完整的起跳+滞空+落地（怀旧服普通跳约 0.7~0.9s），
  #   盖住整个滞空才能真挡住连跳；设短了会在空中补第二跳，照样跳出去。
  #   还连跳就往上加（1.2~1.5）；要连续跳台阶的图可以往下调（0.6~0.8）。
  #   设 0 或负数 = 关闭冷却（退回老行为，不推荐）。
  jump_cooldown: 1.0
  return_home: "home"       # 🔁 Key to use return home scroll.

  # 🖱️ 自动拾取（2026-10-01 加）
  #   用途：宠物老是挡住自己名字（国服靠名字标签定位角色，宠物一挡就找不到人），
  #         但把宠物收起来又没人帮你捡东西了 —— 用这个键代替宠物拾取。
  #   机制：**按一次拾取键，然后等冷却**，不是常开狂按。冷却到点后自动再按一次。
  pickup: ""                # 🖱️ 拾取键。留空 "" = 关闭此功能（默认关）。
  # ⏱️ 拾取冷却（秒）。**实际间隔会在 ±30% 内随机抖动**，不是精确值 ——
  #   原因：真人按键间隔天然带抖动，写死精确周期在统计上「不像人」，
  #   内核反作弊（NGS/GPK）做行为特征分析时这是可识别的信号。
  #   抖动范围：pickup_cooldown × 0.7 ~ pickup_cooldown × 1.3
  #   ⚠️ 冷却调小会让拾取**挤占攻击节奏**（拾取键和攻击键由同一个键盘线程发），
  #      表现是打怪变慢/漏刀。建议 1.5~3.0。
  #      低于 0.5 没意义（人不会每 0.5 秒捡一次，反而更可疑）。
  pickup_cooldown: 2.0

buff_skill:
  # 💫 Buff Skill
  # Automatically apply buff skills when the cooldowns are ready.
  # Buff skills are like: Mage's Magic Guard, Cleric's Angel's Blessing, Thief's Speed Boost
  # ⚠️ Note: If your have a pet to apply buff for you, you can ignore this.
  keys: []                # ⌨️ List of keys to cast each buff skill (e.g., ["a", "s"])
  cooldown: []            # ⏱️ Cooldown time (in seconds), matches the order of `keys`
  action_cooldown: 1      # 🕒 Delay (in seconds) after buffing before continuing actions

directional_attack:
  # 🗡️ Directional Attack
  # Directional attacks are basic attack/skills that only attack player left or right.
  # For examples, Mage’s Magic Claw, Thief’s dart throw, or even a snail shell toss are all directional attack
  range_x: 350               # ↔️ Horizontal attack range (in pixels)
  range_y: 70                # ↕️ Vertical attack range (in pixels)
  cooldown: 0.9              # ⏱️ Time between attacks (in seconds)
  # 🔄 转身保持帧数（2026-09-17 加）
  #   出招前**按住方向键**多少帧，确保游戏里朝向真的切过来。
  #   关键：出招那一帧必须**松开**方向键，否则技能会朝转身前的朝向飞走
  #   —— 症状就是「后面的怪打不到，一直朝路线前进方向砍空气」。
  #   0 = 不转身（等同旧行为，会砍空气）；3 ≈ 100ms，够游戏转身。
  turn_frames: 3

aoe_skill:
  # 💥 AoE Skill
  # AoE (Area of Effect) skills hit enemies no matter which direction the chrarcter is facing.
  # For examples: Cleric’s Heal, Holy light, Mage’s Lightning Bolt are all AOE skills 
  range_x: 400               # ↔️ Horizontal skill range (in pixels)
  range_y: 170               # ↕️ Vertical skill range (in pixels)
  cooldown: 0.05             # TODO: Currently just a filler

# 血量监控（health_monitor）已于 2026-09-10 移除：
# 它的血条识别把上游 UI 尺寸写死在代码里（注释明写 752x1282、条宽高比 7.5），
# 国服是 Unity 重制 UI，这套判据实测不成立；而且找不到血条时静默返回、不报错，
# 排查成本高。→ 喝药改由游戏内宠物 / 手动解决。
#
# ★ 2026-09-27 重新实现：血蓝监控 + 自动喝药（下面的 bars / potion 两段）
#   与上面那个已删除的 health_monitor **不是同一套东西** ——
#   那套是上游台服的写死判据（只在 752x1282 成立，国服根本没有），
#   这一套是按国服真机画面实测标定的，只对「窗口化 + 1366x768 + 缩放 100%」
#   这一种环境有效（见 bars 段的说明）。

bars:
  # ❤️💙 血条 / 蓝条识别（2026-09-27 加）
  #
  # ⚠️ 这一段是**开发期实测标定好的，用户不需要改、也不该改**。
  #    下面所有坐标都是「相对游戏画面左上角」的像素（即客户区坐标，
  #    **不含**窗口最上面那条标题栏）。改了游戏分辨率或系统缩放就会失准。
  #
  # 环境要求（三条都要满足，缺一条读数就会错）：
  #    ① 游戏内分辨率设成 1366x768
  #    ② 游戏**窗口化**运行（不要全屏、不要最大化到别的尺寸）
  #    ③ Windows 显示缩放设成 100%
  #    工具开跑前会自己检查这三条，不对会拦住并告诉你怎么改。
  #
  # 实测依据（2026-09-27，**真机实测**，不是从静态截图估的）：
  #    血条和蓝条是**并排的两条**（左边红=血、右边蓝=蓝），不是上下叠放：
  #        血条填充 x 466~630、蓝条填充 x 634~798，两条 y 都是 746~763。
  #    两条**都宽 165px、都高约 18px**（含外框），距画面底边约 4px。
  #    ⚠️ 条宽在 768p 与 1080p 下**都是 165px**（若等比缩放应是 232px）
  #    ⇒ 游戏 UI 是固定像素尺寸，屏幕越大它不动、位置才变。
  #    所以这套 roi 只对 1366x768 有效，别的分辨率位置就偏了。
  #
  # 怎么核对的（可复现）：游戏里看血/蓝的数字（如 HP 454/454、MP 940/940），
  #    两条都满时，下面的读数应当**正好都是 100.0%**。真机连抓 12 帧实测
  #    100.0% / 100.0% 稳定不跳。

  hp:
    name: "血量"
    # 📐 roi = [左, 上, 右, 下]，框的是**血条的填充区本身**（不要框外框白边）
    #    实测：填充 x 466~630、y 746~763 → 取 [466, 746, 631, 764]（宽 165）
    #    ⚠️ 右下角是**开区间**（Python 切片习惯），所以右端点写 631 = 取到 630。
    roi: [466, 746, 631, 764]
    span: [0, 164]      # 📏 满值填充区在 roi 内的横向范围（闭区间，含首尾）
                        #    满值宽 165px → 下标 0..164。这一项**必须有**：
                        #    没有它时满值宽度会退化成整个 roi 宽，读数会封顶
                        #    （血满着还显示 60% → 疯狂喝药）。
    hsv_lower: [0, 150, 150]     # 🎨 红色的 HSV 下界（真机实测：H≈0~1、S≈245、V≈204）
    hsv_upper: [10, 255, 255]    # 🎨 红色的 HSV 上界
    min_pixels: 4       # 🔢 一帧至少要有几个像素命中才算"这帧可信"
                        #    低于它就判为闪烁帧（返回"未知"而不是 0%），
                        #    否则低血量时血条一闪就被当成"快死了"。

  mp:
    name: "魔法"
    # 📐 蓝条在血条**右边**，不是同位置 —— 见上面的实测数据。
    #    实测：填充 x 634~798、y 746~763 → 取 [634, 746, 799, 764]（宽 165）
    roi: [634, 746, 799, 764]
    span: [0, 164]
    hsv_lower: [90, 120, 80]     # 🎨 蓝色的 HSV 下界（真机实测：H≈100~107、S≈255、V≈208）
    hsv_upper: [130, 255, 255]   # 🎨 蓝色的 HSV 上界
    min_pixels: 4

potion:
  # 🧪 自动喝药（2026-09-27 加）
  #
  # 一句话说明：血量/蓝量掉到下面设定的**档位**以下，就帮你按一下对应的药水键。
  #
  # 防误喝（这四条是按顺序挡的，不是随便写的）：
  #    ① 读数读不到（切图、闪一下、没开游戏）→ 什么都不做
  #    ② 读数不在 0~100 之间（读错了）        → 什么都不做
  #    ③ 距上次喝同一种药还没到冷却时间        → 什么都不做
  #    ④ 连续 confirm_frames 帧都低于阈值      → 才真的按键
  #    第④条是关键：血条偶尔闪一下、切图瞬间读到一个低值，
  #    只看一帧就会误喝；要求连续几帧一致就基本不会误触。
  #
  # ⚠️ 按键前会检查「游戏窗口在最前面」——不在最前面就**一个键都不发**，
  #    避免把翻页键（pageup/home/end）落到浏览器或编辑器上。
  enabled: true         # 🔛 总开关（界面上也有按钮，可以随时关）
  confirm_frames: 2     # 🔁 连续几帧都低于阈值才喝（2 ≈ 0.07 秒）
                        #    调大 = 更稳但反应更慢；调小 = 更快但可能误触；
                        #    最小 1（等于只看一帧，不推荐）

  hp:                   # ❤️ 血量档位：按 threshold **从小到大**排，
                        #    读数低于哪一档就用哪一档的键。
                        #    key 填 null = 这一档不按键（占位用）。
    - name: "危险"      # 🚨 血很危险 → 用大补
      threshold: 30
      key: "pageup"     # ⌨️ 改成你自己游戏里放大药水绑的键
    - name: "偏低"      # ⚠️ 血有点低 → 用普通补
      threshold: 60
      key: "home"       # ⌨️ 改成你自己游戏里普通药水绑的键

  mp:                   # 💙 蓝量档位（形状同上）
    - name: "危险"
      threshold: 30
      key: "end"        # ⌨️ 改成你自己游戏里蓝药水绑的键
    - name: "偏低"
      threshold: 60
      key: null         # 🌙 蓝偏低不自动补（有些职业不缺蓝）——
                        #    想补就把 null 换成键名

  hp_cooldown_sec: 1.5  # ⏱️ 两次喝**血**药之间的最短间隔（秒）
  mp_cooldown_sec: 1.5  # ⏱️ 两次喝**蓝**药之间的最短间隔（秒）
                        #    防"连续几帧都低 → 一口气灌十瓶"。
                        #    要看你药水的实际冷却：游戏里能连着喝就调小（0.5），
                        #    喝完有硬直就调大到 2~3。

# 边缘瞬移（edge_teleport）已于 2026-09-10 移除：
# 它靠在路线图上找粉色标记来判断平台边缘，而那个标记代码不会自动生成，
# 需要手工在每张路线图上涂一遍 —— 工序太重。改为把路线画得离平台边缘远一些。

nametag:
  # 🏷️ 角色名标签识别（国服唯一可用的角色定位方式）
  # 原理：在游戏画面内用模板匹配定位自己角色头顶的名字标签，反推角色位置。
  # 国服怀旧服无法通过组队血条识别角色位置，因此本项为必需功能，没有开关。
  # 使用前必须先把 <name>.png 放到 nametag/ 目录下（截取自己角色头顶的名字标签）。
  name: "example" # 加载 nametag/<name>.png 作为模板（填文件名，不含 .png）
  mode: "grayscale"  # 🧪 匹配模式，可选："white_mask" "grayscale" "histogram_eq"
  # ⚠️★ 2026-09-28 撤回 v1.0.11 的默认值改动（white_mask → grayscale）。
  #   v1.0.11 把默认改成 white_mask 是**一次回归**，真机帧实测（14/14）：
  #     white_mask：模板退化为"全 255 常数"——绿底 (0,255,0) 灰度≈150，
  #       恰好过 inRange(150,255) 下限 → 绿底全被判成白字，而 get_mask
  #       掩码又把绿底排除 ⇒ 参与比对的像素**全是同一个值 255**（常数模板）
  #       ⇒ 画面里任何纯白区域（天空/UI/填充边）都能拿 SQDIFF 0 分
  #       ⇒ 匹配锁死在填充边 (-58,-14)，分数完美、不触发任何告警
  #       —— 用户看到的就是"定位漂移得非常厉害"（issue #4，2026-09-28）。
  #     grayscale：14/14 全对，分数最高 0.0035（阈值 0.01）。
  #   v1.0.11 注释里"grayscale 会把 78% 绿底拿去比对"的判断是**错的**：
  #   引擎的 get_mask 绿底排除层（精确颜色匹配）在**所有模式**下都生效，
  #   grayscale 一直是对的。
  #   引擎 load_config 会自动把存量配置里的 white_mask 纠正为 grayscale
  #   （见 MapleStoryAutoLevelUp.py 名字模板加载段），老用户无需手改。
  # 🎯 标定值：由「名字模板左上角」反推「角色中心」的偏移。**不是调参项，是量出来的数。**
  #
  # ⚠️ 代码真实语义（2026-09-10 核过 engine 第 433-435 行，与上游原版逐字一致）：
  #      loc_player.x = 名字模板左上角x + 模板宽//2   → offset[0] **完全不生效**（填什么都不读）
  #      loc_player.y = 名字模板左上角y − offset[1]   → 即 offset[1] = 名字顶边y − 角色中心y
  #
  # 📐 国服排布（2026-09-10 用户实测）：**人物在上、名字在下**，名字下面还有个更醒目的称号。
  #    ⇒ 角色中心落在名字框的**上方** ⇒ offset[1] 应为**正数**（与默认值 +30 同向）。
  #    框名字时**只框名字那一行**，别把下面的称号框进来（换称号就失配）。
  #
  # ⚠️ 但数值本身仍不可信：上游把 nametag 标为 deprecated（默认 enable:False、实际用组队血条），
  #    所以 [-50, 30] 从未被标定验证过；上游那句注释的方向还与代码是反的。**别手填。**
  #
  # 🔧 标定方式：界面上按 F2「标定名字」（或 python -m tools.calibrate_nametag）——
  #    框住名字那一行 + 点一下角色中心 → 自动反解本值并写进 config_custom.yaml。
  offset: [-50, 30]
  # 📏 命中阈值 [0.0 ~ 1.0]。底层 SQDIFF_NORMED（0=完全一样，1=完全不同），判据 `score < 阈值`，
  #    所以 **值越大越宽松，值越小越严格**（原注释写成「越低越宽松」，方向是反的，已更正）。
  #
  #    取值依据（2026-09-10 实测；模板 = 名字白字掩码、整块匹配；11 个帧文件里 10 帧可评）：
  #      · 6 张真实游戏帧（含跨地图）真位置得分 **0.0000 ~ 0.0057**，落点全部正确
  #      · 已知假阳性：登录界面 **0.0466** / 0.0333（且落在"合法"区域！）、抓错窗口 0.0451
  #    ⇒ 0.01 正好卡在两者中间：真帧有 1.8 倍以上余量，假阳性被挡掉 3 倍以上。
  #    ★ 2026-10-14 重标模板后复测（用户按 F2 重标；引擎自己的口径、真机抓帧）：
  #      真位置分 **0.0000~0.0016**（12-42-11 / 12-43-36 两帧是 0.0000 = 逐像素相同），
  #      同图"另一处最像的地方" **0.0232~0.0265** ⇒ 本阈值仍有 6~12 倍余量，
  #      故 0.01 **保持不变**：重标模板不需要跟着改阈值，只需阈值继续待在两个峰之间。
  #    ⚠️ 宁可偏紧：阈值只决定"认不认这次命中"——**认错 = 位置错（危害大）**，
  #       不认 = 沿用上一帧位置（几乎无害，角色帧间位移很小）。
  #    ⚠️ 位置本身取的是**全图最低分**那一处，阈值不参与选位置。
  #       上游旧值 0.2 太松：上面那些 0.03~0.05 的假阳性全能混过去。
  diff_thres: 0.01

  # 💾 位置存盘（2026-10-14 加）：名字模板命中时把锚点按地图存到
  #    minimaps/<图>/nametag_pos.json；开局若认不到名字，就先按存下来的位置出招。
  #    为什么需要：名字偶尔认不到时引擎会沿用**上一帧**的位置，而**开局那几帧**
  #    没有"上一帧" ⇒ 位置停在 (0,0)、攻击框落到画面左上角（只走不打，且不报错）。
  #    关掉它 = 把这个键设为 false；回滚也可以直接删掉那个 json 文件（不会崩，
  #    只是回到旧行为）。存盘失败不影响挂机，只在日志里吼一次。
  pos_cache: true

  # 📸 丢名字时存画面（2026-10-14 加，**诊断用**）：名字连续认不到时，把"当时的画面"
  #    存两张图到 `debug/` —— 光看日志分不出是哪种原因（名牌被裁 / 被挡 / 角色不在
  #    画面里 / 分数判错）；真机 2026-10-14 12:43 那轮 33 条告警一条画面都没有。
  #      · `nt_miss_<时间>_miss<N>_full.png`：整帧原图，上面画了
  #        绿框 = **上次命中的名牌位置**、黄十字 = 由此推出的**角色位置**、
  #        红框 = 本帧**索敌框**；
  #      · `nt_miss_<时间>_miss<N>_crop.png`：名牌本该在的位置 ±(模板 + 60px)，放大 3 倍。
  #    触发点与日志同源：`nametag_miss_streak` 跨过 30 的整倍数（30/60/90…）那一帧，
  #    且距上次存图 ≥ 5 秒（节流）。**纯观测**：不参与任何判定；失败只吼一次、
  #    绝不影响挂机（fail-open）。关掉：`miss_dump: false`。
  miss_dump: true

  # 🩹 抗闪（2026-10-14 加）：分数落在"半峰"时也采信，条件是**位置不跳**。
  #    病根（真机日志 2026-10-14 11:42 实测）：认得出的帧分数 0.0000~0.0099，
  #    认不出的帧 0.0220~0.0240（正好卡在本阈值之上），而"完全失配/假阳性"是 0.033~0.047
  #    ⇒ 这一档当时判为名牌被挡了一部分。它本身不致命，致命的是连锁反应：
  #       miss 计数涨过 stale_pos_full_frame_after（该键 2026-10-14 最终定为 **0 = 关掉
  #       整帧放大**；当天曾临时上调 25、重标模板后撤回 10、当晚再关成 0，理由见下面 ★）
  #       ⇒ 索敌框放大到**整帧**
  #       ⇒ 怪数虚高（真机 怪8~怪10，正常 怪0~怪2）、去追画面外 550px 的目标。
  #    判据两条（都在 src/utils/common.py 的 nametag_relax_decision 里，只有那一处）：
  #       ① 分数 < diff_thres × relax_ratio
  #       ② 候选位置离**上次严格命中**的锚点 <= relax_max_jump 像素
  #    ②是安全阀：位置错了比位置偏了更糟（索敌框/攻击框都以它为中心），
  #    所以放宽必须**有界**；锚点永远是严格命中的位置，不会链式漂移。
  #    关掉：relax_ratio 设为 1.0（= 逐字退回旧行为）；relax_max_jump 设小则更保守。
  #    ⚠️ 放宽采信的帧**不写** nametag_pos.json（存盘只留经过严格验证的锚点）。
  #    ★ 2026-10-14 重标模板后复测（引擎口径，真机抓帧）：真位置分 0.0000~0.0016，
  #      而**同一张图上"另一处最像的地方"**（=假阳性档）是 0.0232~0.0265 ⇒ 放宽上限
  #      必须**低于** 0.0232 才有意义。原值 2.5（上限 0.025）会把这档假阳性也放进来
  #      （只靠 ② 的 12px 锚点兜着）⇒ 收紧到 2.0（上限 0.020）：真位置仍有 12 倍余量，
  #      假阳性档被挡在门外。
  relax_ratio: 2.0      # 分数放宽倍数（1.0 = 关闭；2.0 ⇒ 0.01→0.020 才采信）
  relax_max_jump: 12    # 放宽候选离上次严格命中的最大曼哈顿距离（像素）

  global_diff_thres: 0.01  # 🧠 先在上次位置±50px 内搜；分数低于此值就直接采用，不再全图搜
  # If the diff is higher than this threshold, do a full-frame search.
  # If lower, search near the last known location to save time.
  # Set to 0.0 to disable this optimization
  # ⚠️ 它也参与「命中」判定（find_pattern_sqdiff 里局部命中就直接返回），所以必须与 diff_thres
  #    同量级；否则局部搜索会把 0.03~0.05 的假阳性当命中。

  split_width: 999  # ✂️ **主匹配**用整块（必须 ≥ 模板宽）。填 999 → 60//999=0 → 1 块 = 整块。
  # 上游默认 30 会让引擎把 60 宽的名字切成 2 块、**只取最好的一块**（=只用半个名字），
  # 判别力反而变薄（实测左半块跨图真位置分 0.0092，离阈值 0.01 只剩 1.09 倍）。
  # 主匹配必须用整块：跨地图实测真位置 0.0003、全图仅 1 处 <0.001，这是最干净的信号。

  split_width_fallback: 30  # ✂️ **兜底匹配**的切块宽度（0 = 关闭兜底）
  # 为什么要有兜底：名字底板会被**别的玩家的名牌压住**。实测 20 帧"人堆里走位"的帧：
  #   只做整块 → 7/20 帧能定位；整块失败再退到切块 → **11/20 帧**，
  #   救回来的那 4 帧落点全在合理轨迹上（整块 0.0174 刚过阈值被拒的那帧，半块拿到 0.0059）。
  # 两遍共用 diff_thres：救回来的帧分数 0.0002~0.0059 都低于 0.01，而认不出的帧最低也有 0.0174
  #   —— 一个阈值就切得开，不需要给兜底单独放宽。
  # 代价：整块失败时才多跑一遍匹配（安静地图很少触发，几乎无成本）。
  # ⚠️ 那 20 帧取自**极端拥挤的城镇**（用户为压测特意选的），正常刷怪点远没这么挤 ——
  #   所以 7/20、11/20 应看成**最坏情况的下限**，不是日常值。

character:
  # 🧍 Character
  # Your character's size in pixels.
  # 用途：把「玩家自己」所在的矩形区域从怪物搜索里排除，避免把自己当怪。
  # 三种模板模式（color / grayscale / contour_only）都会用到，不能删。
  width: 100      # ↔️ Character width (in pixels)
  height: 150     # ↕️ Character height (in pixels)

monster_detect:
  # 🌍 怪物模板的加载范围（2026-09-15 改：默认 true → false）
  #    false = 只加载 config_data.yaml 里「这张图登记的」怪
  #            （map_mobs_mapping[地图]）—— **这是上游原版的行为**，
  #            上游根本没有 match_all_mobs 这个概念。
  #    true  = 加载 monster/ 下的全部模板（本 fork 2026-09-12 加的"图省事"模式）。
  #
  #    ⚠️ 为什么默认改回 false（2026-09-15 实测）：
  #       引擎对**每张 PNG** 都会生成「原图 + 左右镜像」两个模板
  #       （见 engine 里 cv2.flip 那两行），所以实际匹配次数 = PNG 张数 × 2。
  #       monster/ 下现有 20 张 PNG → 每次怪检测要跑 **40 次**全 ROI 模板匹配，
  #       而「废都南方工地」只登记了木妖（9 张 → 18 次）。
  #       白跑的那 22 次让怪检测吃掉一帧的 95%（244ms / 258ms），帧率卡在 3.8fps。
  #    💡 换新图时记得用界面的【🐾 打哪几种怪…】给这张图勾一次；
  #       没登记的话点「开始」会被弹窗拦住（不会静默变成"一次都不打怪"）。
  #    💡 想回到「截一次、所有图通用」就把它设回 true（代价是每帧多匹配）。
  match_all_mobs: false

  # 🔍 多尺度模板匹配（2026-10-13 加，借参考项目 zhoufanglu/maplestory-auto-ds）
  #    「官方素材与游戏内渲染尺寸不一致」时，同一张模板按多个缩放比例各匹配一遍。
  #      · 默认 [1.0] = **不缩放**，与没有这个键时逐像素一致（零额外耗时）。
  #      · 素材尺寸对不上（比如从 maplestory.wiki 下的官方 GIF/PNG 比游戏里大/小）时，
  #        参考项目的推荐值：scales: [0.7, 0.85, 1.0, 1.15]
  #      · ⚠️ 代价 ≈ 匹配耗时 × 尺度数（每张模板本来还有"原图 + 左右镜像"= ×2）。
  #        真机标定（2026-10-13，沼泽地2，contour_only，10 张 PNG 共 20 个模板，
  #        感知框 1000×296）：单尺度 66.7~69.6 ms/帧 ⇒ 四个尺度大约 ×4。
  #        帧率紧张时优先只加 1~2 个比例，别直接上四个。
  #      · 非法值（非数字/<=0/>10）逐条丢掉并 warning；全丢光回退 [1.0]（不静默）。
  #      · 多尺度找出来的同一个怪会被 NMS（IoU 0.4）合并，不会变成多个目标。
  scales: [1.0]                # 📐 模板缩放比例列表，官方素材尺寸对不上时才加

  # 🐌 Monster Detection
  # Automatically detect monsters around your character.
  # Detection mode determines the method used to find monsters.
  # Modes ranked from most to least computational cost:
  #   - "color"         (most accurate but slowest)
  #   - "grayscale"     (slow)
  #   - "contour_only"  (fast, contour-based, a good balance)
  # 💡 Feel free to test different modes to find what works best for your setup.
  mode: "contour_only"         # 🧠 Options: "color" "grayscale" "contour_only"
  diff_thres: 0.8              # 📏 Diff threshold for template matching, [0.0 ~ 1.0] Lower = stricter match
  #   ⚠️ 方向一定要记准：本值是「**差异**阈值」，引擎判定式是 `差异 <= 阈值` 才算命中
  #      （见 engine 里 np.where(res <= diff_thres) 那三处）——
  #      **调小 = 更严格**（只认"非常像"的：漏检多、误报少）
  #      **调大 = 更宽松**（连"有点像"也认：误报多、漏检少）
  #
  #      本文件这里是**上游原值 0.8**，偏松；国服画面上实测误报偏多。
  #      🩹 2026-10-13 更正：本条注释原来写"项目实际生效的值由 config_custom.yaml
  #         覆盖为 0.4"，那个值已经在当天被**标定推翻**了 —— 真机 12 帧实测真怪
  #         命中分数落在 0.028~0.75，0.4 会把 0.53~0.75 那批**真怪漏掉**；
  #         现在的 config_custom.yaml 已改回 **0.8**（保持上游默认）。
  #         当前生效值请直接看 config_custom.yaml 的 monster_detect.diff_thres。
  #
  #      💡 换模板后若发现偏宽/偏严，用 `python -m tools.mob_template_qa` 重新测一遍
  #         模板之间的相似度，再决定这个值往哪边调。
  #      💡 想临时试不同值：`python -m tools.verify_monster --thres 0.3`（不改配置）。
  #
  #      ⚠️ 别和 nametag.diff_thres(=0.01) 搞混：那个是"角色名标签定位"，
  #         UI 元素固定不变、要求极高精度；怪物姿态多变，本来就该宽松得多。
  search_box_margin: 50        # ➕ Additional margin(in pixels) around the attack box for monster searching
  contour_blur: 5              # 🌫️ Gaussian blur kernel size used for contour smoothing (in "contour_only" mode).
  # 🎯 前景色校验闸（2026-10-13 加）
  #    contour_only 只看黑色轮廓、把颜色信息全丢了，于是平台植被的轮廓也能撞进阈值：
  #    实测真帧（画面里**没有**怪）在 diff_thres=0.4 下检出 **17 个假框**，全落在植被上。
  #    打开后，命中点还要满足「模板里**怪自己的像素**（非绿幕背景）逐点比对画面同位置，
  #    逐通道色差 <= verify_color_tol 的像素占比 >= verify_min_ratio」。
  #    标定（同一批真帧 + 把真模板贴回平台的合成"真怪"）：假框通过率 0.33~0.63，
  #    真怪 1.00 ⇒ 默认 30 / 0.75 把 17 个假框全挡掉，真怪一个不丢。
  #    ⚠️ 关掉它（false）= 退回"只看轮廓"的老行为，假框会回来。
  verify_color: true           # ✅ 是否用模板的前景色校验命中点（强烈建议开）
  verify_color_tol: 30         # 📏 单像素逐通道最大色差（0~255，越小越严）
  verify_min_ratio: 0.75       # 📏 前景像素里色差达标者的**占比**下限（0.0~1.0，越小越松）
  with_enemy_hp_bar: False     # ❤️ 用怪物血条辅助检测。国服挂机打的是秒杀怪，血条不会出现，默认关闭；以后打精英/BOSS 可再开。
  hp_bar_color: [71, 204, 64]  # 💚 Enemy HP bar color (in BGR format)
  max_mob_area_trigger: 1500   # 📏 How much does the mob need to overlap with attack range to be considered as a target

  # 🔲 在「游戏画面」页签里，给**每一只识别到的怪**画一个框（2026-09-29 加回）
  #     true  = 画（**默认**）。每只怪一个框，用来肉眼判断「引擎到底看见没看见」。
  #     false = 不画。画面只留「攻击范围 / 索敌范围」两个框，干净。
  #
  # ⚠️ 为什么默认 **true**（2026-09-29 用户拍板）：
  #    这是挂机软件，**没人会盯着软件里的「游戏画面」页签看** —— 都直接看游戏窗口。
  #    那个页签只在**排查时**才打开，而排查时最需要的就是「引擎到底看见没看见」。
  #    ⇒ 默认关 = 这功能等于不存在（要排查的人得先知道有这个开关，可他就是不知道
  #      才来排查的）。默认开才对：反正平时没人看，开了不打扰任何人；
  #      真正打开页签的人，一定是想知道识别情况的人。
  #
  # ⚠️ 只影响**调试画面**（img_frame_debug），**不影响识别**：
  #    识别始终用 self.img_frame（见 run_once 里的注释），debug 图上的
  #    画框不会污染任何颜色/模板判据。开了框不会让识别变准或变差。
  #
  # 💡 排查「识别不到」时的正确用法：打开它，盯着看 ——
  #      · 怪身上**有框**但角色不出招 ⇒ 问题在下游（攻击判定/攻击框范围），
  #        去查 get_nearest_monster 与 attack range，别去调阈值。
  #      · 怪贴脸了却**没有框** ⇒ 确认是漏检，看 diff_thres 是否收得太紧
  #        （调小 = 更严格 = 漏检多；用 tools/verify_monster.py --thres 试值）。
  #      · 满屏碎框、怪身上反而没有 ⇒ 误报太多，diff_thres 收太松。
  draw_mob_boxes: True

  # 🎯 怪「算够得着」的判据（2026-10-14 加，用户 m06668「红色攻击框里有绿色的
  #    检测框，但是就是不攻击」）
  #      · `center`（**出厂默认**，2026-10-14 用户拍板改为宽判定）：怪框**中心**
  #        落在攻击框内 ⇒ 算够得着。用户原话：「人不能准确计算，只能预估大概在
  #        范围内就会攻击，属于宽判定」。判据与眼睛一致，人眼可核对。
  #      · `min_area`（老行为，保留可回退）：与怪框的**交叠面积** >= `_min_mob_area()`。
  #        那条下限取的是本图**最小**那张模板的面积（废铁2 = 青蛇 28×31 = **868px²**）
  #        —— 对**小怪**等于要求它的**整个**框都落在攻击框里，**差 1px 都不算**。
  #        人眼分辨不出 1px ⇒ 看到的就是「绿框明明在红框里、却不出招」。
  #        （真机 2026-10-14 13:57 那轮：11 条归因全是 `交叠 0/868`，怪在 236px 外
  #          —— 那一档不是这个病；这个病是"压边 1~几像素"那一档，只在宽判定下才打。）
  #      ⚠️ 非法/缺失值一律按 `min_area`（保守 = 老口径，绝不静默放宽）。
  #      ⚠️ 想回退：把本键改成 `min_area` 就行（不必重启引擎，但要重启界面才会写进
  #         `config/.config_tmp.yaml`，那里优先级更高）。
  #      ⚠️ 想先看证据再决定：`[没出招·归因]` 行会写「离『算够得着』最近的那一只：
  #         交叠 A/B px²（还差 …；中心已在攻击框内的有 N 个）」——
  #         N>0 就说明中心已经在框里却仍不算，那是判据偏严；差得远则是索敌框大一圈，
  #         属于预期行为，不用改。
  mob_engage_mode: center

  # 「宽判定」的像素余量（2026-10-14 用户 m08016 拍板，依据同一轮示范录制的读数）
  #   · 判定「够得着」时，把攻击框**向外各扩这么多像素**再算 —— 人眼是预估的
  #     （用户 m06810：「人不能准确计算，只能预估大概在范围内就会攻击，属于宽判定」）。
  #   · 为什么是 40：示范录制里 389 帧「引擎**看见了**怪、却判够不着」中，最近那只
  #     怪 **69% 只差在框外 ≤ 45px**（dx p50=6px/p90=45px；dy p50=0/p90=42px）
  #     —— 就是"差一点点就不算"。40 覆盖其中绝大多数，且不至于把框撑到索敌框那么大。
  #   · `0` = 关掉（严格按技能真实框，回到 2026-10-14 之前的行为）。
  #   · ⚠️ 只放大**判定**用的框；屏幕上画的攻击框仍是技能真实范围（不变大）。
  #   · ⚠️ 缺键 ⇒ 按 40（老配置文件里没有这个键也照 40 走，免得出"改了没效果"）；
  #     畸形/负数/>200 ⇒ 按 0（保守：绝不因为配置写坏而静默放宽）。
  #   · 怎么核对：`[怪检测]` 行会写「＋宽判定余量 40px（上面这个框已向外各扩 40px…）」，
  #     这条行里的「中心在框内」与引擎的判定**同源**（都走 `_attack_boxes()`）。
  mob_engage_margin: 40

  # 📋 `[怪检测]` 明细行（2026-10-14 加，纯观测）
  #    用户 m06852「记录下怪物的检测信息，现在的攻击还是不够灵敏」——
  #    只看「怪N」看不出它在哪、离攻击框差多少、引擎以为角色在哪，
  #    于是"够不够灵敏"既没法证、也没法调。打开后每次怪检测变样时写一行：
  #        检出 N 只 | 攻击框内 A / 框外 B | 判据 center（门槛 868px²）
  #        | 攻击框 x[..,..] y[..,..]（±180×±80）| 角色(x,y)；明细 ★1(..)…
  #    节流：框内那批怪变了且距上次 >= 1 秒 ⇒ 立刻写；否则 >= 5 秒写一次。
  #    ⚠️★ 2026-10-14（P4，用户 m10830）：本开关**同时**管 `[开火预算]` 那行
  #        （每 5 秒一条，跟在 `[运行状态]`/`[出招]` 后面）：近 60s 覆盖率 +
  #        "可见→确认 / 确认→进框 / 进框→出刀"三段中位数 + 没打成的账
  #        （被让路 / 未确认 / 高差 / 爬绳放弃）。关掉本开关 ⇒ 两行都不写。
  #    关掉：改成 false（这一行就不写了，其它日志不受影响）。
  #    ⚠️ 纯观测：异常只吼一次，绝不影响判定/挂机；也不参与任何阈值。
  detect_log: true

  # ⏱️ 每隔几帧才**真的**跑一次怪检测（2026-09-14 实测加）
  #    1 = 每帧都跑（关掉降频，回到老行为）；2 = 每 2 帧跑一次（默认）
  # ⚠️ 为什么需要它（真机实测数据）：一帧 552ms 里**怪检测占 502ms（91%）**，
  #    是帧率卡在 1.8fps 的**唯一元凶**（抓帧 4ms、名字定位 16ms、小地图 5ms、
  #    可视化 5ms —— 剩下的全不算什么）。
  #    降频后省下的时间会让帧率涨回去：每 2 帧测一次 → 帧率 1.8→3.3，
  #    而"两次检测之间"只从 552ms 变成 602ms（慢不到 0.1 秒），
  #    换来的是导航 / 回正 / 按键响应快一倍 —— 很划算。
  #    中间帧沿用上一次的结果（monster 列表保持不变）。
  every_n_frames: 2

  # ── 巡逻中「停下来打怪」（2026-10-13 加，用户要求）──────────────────────
  #   用户原话：「巡逻中，检测到怪，打完怪再移动，而不是在移动中穿插着攻击」。
  #   true  = 索敌框里认出怪就**把移动清零、站定**，一直打到框里连续几次没怪再走；
  #   false = 老行为：边走边打（路线方向与出招同帧发，怪常常只吃到擦身而过的几刀，
  #           而且一边走一边放技能，攻击节奏被路线方向不断打断）。
  #   ⚠️ 回正线期间**不参与**（回正是"回家"，优先级高于打怪 —— 引擎里那条
  #      `if self.is_using_home_route: return` 在本段之前）。
  stop_to_attack: true
  #   连续几个「**检测帧**」框里没怪 = 判定打完了。
  #   ⚠️ 不是游戏帧：怪检测被 every_n_frames 降频（默认 2），
  #      所以 1 个检测帧 ≈ 2 游戏帧 ≈ 0.6 秒。
  #   调大 = 更不容易"怪还没死就走"（代价是打完后多站一会儿）；
  #   调小 = 走得快（代价是怪一动丢帧就走人）。
  stop_attack_clear_frames: 2
  # ★ 2026-10-14 加（低频识别优化 P1）：判定「打完了」的**空窗秒数**。
  #   与上面那个帧数是**与**关系：两个都满足才判完。
  #   为什么要有秒数（帧数不够用的理由）：1 个检测帧的**真实时长随 fps 变** ——
  #     真机实测 29.4fps + every_n_frames=2 ⇒ 68ms；而 2026-10-13 沼泽地2 标定时
  #     只有 3.3fps ⇒ 600ms。同样"空 2 帧"，一个是 136ms、一个是 1.2 秒 ——
  #     用户一改 every_n_frames 行为就跟着变。秒数阈值与采样率无关。
  #   另有一条**更硬**的判据（同批加）：本次停留**一次都没出过招**就**不判**"打完"
  #     （那是"打不着"不是"打完了"）—— 秒杀怪的正解反过来用在这条上：
  #     出过招 + 空够秒数 ⇒ 立刻收手（不会为一只已经死掉的怪再站 3 秒）。
  #   0 = 退回只按帧数判（老口径）。
  stop_attack_clear_s: 0.3
  #   最长停几秒（安全阀）。超时会**强制恢复巡逻**并打一条 WARNING ——
  #   防"怪打不到 / 检测在闪 / 目标其实够不着"把角色永久钉在原地。
  #   ⚠️ 另有一条**更早**的放行：停下之后一直**出不了招**（约 2.5 秒没有攻击指令）
  #      就放行 —— 那说明这只怪根本打不着（比如在正上方/正后方），没必要傻站。
  stop_attack_timeout_s: 20

  # 🎯 目标锁定（2026-10-14 加，用户要求「一旦发现目标就持续攻击，直到怪物消失」）
  #   攻击框里认出过怪 ⇒ **记住它**；在下面这个秒数内**不判"打完"**，
  #   它不在攻击框里就追过去（只追同一层）、追不到就守着最后位置继续出招；
  #   连续 target_hold_s 秒没再看见它，才算"怪物消失"、恢复巡逻。
  #   ⚠️ 0 = 关掉本功能 ⇒ 退回老口径（连续 stop_attack_clear_frames 个检测帧
  #      框内为空就放行）。
  #   为什么需要它（真机日志 MSBot_2026-10-14_10-03-15.log 的 11:02 段实证）：
  #      老口径在 AOE（攻击框 ±170×±70）+ every_n_frames=2 下**约 0.15 秒**就判
  #      "打完"，而怪自己在走动 ⇒ 日志里 [停下打怪]/[判定打完] 每秒抖好几次，
  #      `运行状态` 几乎全是 `指令(left none none)`：一直在走、基本没打。
  #   两条安全阀（2.5s 出不了招 / stop_attack_timeout_s 总时长）**照旧生效**，
  #   本键不会把角色钉在原地。
  target_hold_s: 3.0

  # ── 追怪的防抖（2026-10-14 加，低频识别优化 P1）────────────────────────
  # 病根（真机日志 MSBot_2026-10-14_10-03-15.log 的 11:02 段实证）：
  #   ① 单帧匹配偶尔在别处认出一个**假目标**（幻影），老口径"看见一帧就追"会
  #      让角色为一个不存在的目标横着走几百像素；
  #   ② 日志里 `[靠近] …left 侧 323px` / `right 侧 282px` **每隔几秒换一次边** ——
  #      两只怪离得差不多远时"最近的那只"每帧都可能换人，角色就来回抽方向。
  # ⚠️ 这两条只约束"追"（走路），不约束"停下打"：停下的代价小且必须敏捷。
  #   `approach_confirm_s: 0` = 关掉这道防抖（逐字退回"看见一帧就追"的老口径）；
  #   `approach_dir_min_s: 0` = 不要求方向保持（同样退回老行为）。
  approach_confirm_s: 0.5
  #   追怪方向的最小保持秒数：老方向那侧**还有怪**时，这段窗口内不许掉头。
  #   老方向那侧一只怪都没有 ⇒ 立即掉头（不会为了保持方向背对目标走）。
  approach_dir_min_s: 0.4

  # ── 交战期间只扫攻击框（2026-10-14 加，低频识别优化 P2）──────────────────
  #   true（默认）= 一旦停下打怪（`_stop_hold`），索敌框临时收紧到
  #   「攻击框 + search_box_margin」。为什么：一次怪检测 17.1ms 里 ~99% 是模板匹配，
  #   匹配耗时 ∝ 扫描面积；实测全感知框 660×264 → 攻击框 340×140 是
  #   **17.1ms → 7.2ms（-58%）**，而交战期间要回答的只有"目标还在不在、
  #   有没有新怪靠过来"（都发生在攻击框附近）。松开后立刻恢复全感知框。
  #   ⚠️ 位置连续丢失（stale_pos_full_frame_after）时**优先放大到整帧**，不看本键。
  #   false = 逐字退回老行为（交战期间也扫全感知框）。
  engaged_scan: true

  # ── 感知范围放大（2026-10-13 加，用户选的方案 A：看得远 + 够不着就走过去打）──
  # 为什么要单独有它：索敌框原来**就是**攻击框（±(range/2+margin) = 500×270，只占
  #   1366×768 客户区的 13%）。用户真机实测 12 帧：整帧 53 只怪里 46 只（87%）
  #   落在框外 ⇒ 现象是"身边明摆着有怪，机器人不认"。
  # 这个倍数只放大**看得见**的范围，**不放大攻击判定**（攻击仍按 aoe_skill.range_*）。
  #   看得见但够不着的怪，由 approach_mob 让它"走过去打"。
  #   1.0 = 退回老行为（只看攻击框那么远）。
  detect_range_scale: 2.0
  # ★ 2026-10-13 加：**竖直方向单独一个倍数**。默认与 detect_range_scale 同步；
  #   出厂给 1.1 是因为感知框唯一的下游用途是 approach_mob，而它只在**同一层**
  #   才敢走（|dy| <= approach_dy_tol = 60）—— 竖直多看 ±270px 是纯浪费：
  #   真机 12 帧里 60% 的怪在角色上方 280~320px（上层平台），既够不着也走不过去。
  #   实测（同一批 12 帧，模板 10 张含翻转）：
  #     1000×540 = 141ms  →  1000×296（本键 1.1）= **77ms**（省 45% 检测耗时）
  #   而 x 方向的"看得见多远"一点没少。缺这个键 ⇒ 沿用 detect_range_scale。
  detect_range_scale_y: 1.1
  # 够不着就走过去打（用户需求：巡逻中检测到怪 → 过去打 → 打完再走）。
  #   false = 老行为：只打攻击框内的，框外的当没看见。
  approach_mob: true
  # 「同一层」的高度容差（px）：怪与角色的高度差超过它就不横着走过去
  #   —— 上面/下面的平台要爬梯子或跳，硬走会掉下去，交给路线。
  approach_dy_tol: 60
  # 位置连续丢失多少个检测帧后，把索敌框临时放大到**整帧**（0 = 关）。
  #   位置已经不可信时还拿它当中心，只会把怪框在错误的位置外；
  #   "框错了"比"框大了"更糟（大了只是多算几次模板匹配）。
  #   ⚠️ 2026-10-14 真机实测（log/MSBot_2026-10-14_12-30-15.log，36 条状态行）：
  #     名字定位 miss 涨到 10 以上时（miss10/15/17/21/24/27/31/44 各一到数次），
  #     本键一到就放大到**整帧** ⇒ `怪` 数虚高（怪8~怪12）、[靠近] 去追 400~550px
  #     外的目标 —— 但根子是**名字模板不贴合**（真位置落进假阳性档 0.022~0.024），
  #     不是 10 这个值本身有问题。
  #     ★ 2026-10-14 当天按 F2 重标模板后，用引擎自己的口径在真机抓帧上复测：
  #       真位置分 **0.0000~0.0016**、假阳性档 0.0232~0.0265 ⇒ 名字几乎帧帧能对上，
  #       miss 涨不到 10 ⇒ 临时上调（10→25）**已撤回**，恢复 10。
  #       若哪天又见"怪数虚高 + 去追几百像素外的目标"，先看状态行的 miss：
  #       持续 ≥10 ⇒ 模板又该重标了（不是来调这个值）。
  #     ★★ 同一天再改（用户拍板）：**本键设为 0 = 关掉「整帧放大」**。
  #       依据：12:43 那轮真机只跑了 4.6 分钟，名字告警 **33 条**（miss 最高 71）
  #       ⇒ 放大确实被反复触发，副作用当场可见（怪 8~12、去追 400~550px 外的目标、
  #       名字定位耗时 22ms 峰值）。而"为什么会丢名字"当时还没查清 ⇒ 先关掉这个
  #       副作用，改用 `nametag.miss_dump` 存下来的画面去查根因。
  #       ⚠️ 代价（如实记账）：位置过期期间索敌框也按**过期位置**算 ⇒ 可能漏打。
  #          用下一轮日志对比 `[没出招·归因]` 里 `no_engage`（"攻击框里一个都没有"）
  #          的行数是否变多即可看出代价有多大。
  #       ⚠️ 取值语义：**0 = 关**（get_search_box 里的判据是 `_after > 0`）；
  #          正数 = 丢多少帧之后放大到整帧。想恢复旧行为就把它填回 10。
  #   ⚠️ 为什么不写进 config_custom.yaml：`monster_detect` 段由**界面**管理
  #     （src/ui/ui.py:2261 _MANAGED_SECTIONS），界面保存时以界面内存为准算差异 ⇒
  #     手写进 custom 的键，只要界面内存里没有它，下一次保存就被抹掉
  #     （2026-10-14 实测：12:38 手写 25，界面 12:39:02 / 12:40:14 两次保存后消失）。
  stale_pos_full_frame_after: 0

# 换频道相关配置（channel_change / scheduled_channel_switching）已于 2026-09-10 移除：
# 国服到处是人，「遇人换频道」等于一直换；「定时换频道」同理没有意义。

ui_coords:
  # 🧭 界面按钮坐标（**相对游戏客户区**，即 get_img_frame() 裁剪后的画面）
  #
  # ⚠️ 下面这组坐标是上游台服在 1282x693 画面上录的，对国服**已作废**。
  #    重录方式：先量出真实客户区尺寸写入 game_window.size，
  #    再在真实画面上框出按钮位置（登录按钮模板做好后一并标定）。
  #    录制基准由 game_window.coord_base_size 声明，留 ~ 表示就是 game_window.size。
  ui_y_start: 680                       # 📐 UI y start
  "select_character": [888, 275]        # 📐 Select character button during login
  login_button_thres: 0.05              # 📏 threshold to detect a login button on game window
  login_button_top_left: [838, 317]     # 📐 top left corner of login button search ragne
  login_button_bottom_right: [940, 373] # 📐 bottom right corner of login button search ragne

route:
  # 🧭 Route Following
  # The character follows a pre-defined route image (route*.png) using color-coded commands.
  search_range: 10            # 🔍 Radius (in pixels) to search for the nearest route color around the player

  pingpong_single_route: true # 🔁 只录了**一段**主线时，走到头自动掉头往回走（2026-09-12 加）
                              #    背景：单段时 `idx_routes = (idx+1)%1` 恒为 0，角色走到终点后
                              #    仍跟着同一段走，而终点附近像素的指令还是"继续往前"
                              #    → 一路冲出平台（实测：启动后直奔右边不停）。
                              #    开着这个，录一条线就能在平台上来回走，不必录"去+回"两段。
                              #    录了**两段及以上**时自动失效（靠 goal 切段循环）。
  pingpong_turn_range: 15     # 📍 回程时离起点多近算"走到了"、该掉头（曼哈顿像素）。
                              #    太小会走过头才掉头；太大还没走到就掉头，来回范围变短。

  goal_reach_range: 15        # 🏁 离本段终点多近就算"这段走完了"、该切下一段（2026-09-12 加）
                              #    背景：goal 圆点半径只有 2px，而玩家坐标是**质心**、
                              #    踩不中就判不到 —— 平台本来不长时（实测路线跨度仅 12px），
                              #    角色走过去却不触发切段，冲出去后再也找不到像素
                              #    → 表现是「到终点停不下来一直往前走」。
                              #    所以除了"踩到 goal 像素"，再补一条"离终点够近"的判定。
                              #
                              #    ⚠️★ 2026-09-16 订正：这里原来写的是"角色**一帧能走十几像素**"
                              #    + "平台越短、角色跑得越快，这个值越要大一点" ——
                              #    **那是推断、从没实测**。用真机日志实测是
                              #    **~0.3 px/帧（≈4~5 px/秒）**，差 20~50 倍
                              #    （三处互证：录制 7s 走 32px；挂机 5s 走 18px；
                              #      用户自述"一个来回约 10 秒"= 48px）。
                              #
                              #    ⇒ 所以这个值**不是越大越好**：它大了会把短路线的巡逻行程吃掉。
                              #      实测（废都南方工地，gap=24）：15 被 `_near_seg_goal`
                              #      的上限二压到 11，两段的"已到达"区间贴在一起
                              #      ⇒ 角色只在 **2px** 里来回蹭（日志实测 x 62~66），
                              #      看起来就像"卡在一个很小的范围里"。
                              #    ⇒ 现由 `_near_seg_goal` 的**上限三**兜底：
                              #      reach ≤ gap/16（下限 1px）。所以这里保持 15 是安全的 ——
                              #      短路线上会被自动收紧（gap=24 → reach=1），
                              #      长路线（gap ≥ 240）仍按 15 生效。

  # 🎯 切段的**高度**容差（2026-09-27 加）：终点在高处（高台/梯子顶）时，
  #    光靠 x 接近不足以判定"这段走完了"，还要 `|人y - 终点y| <= 本值`。
  #    背景（真机现场，废都南方工地）：
  #      route1 的 goal 在 **y=93**（高台上）、梯子从 y=109 到 93、地面 y=116，
  #      全程爬升 23px。**只看 x** 时，角色还在地面就被判"到达终点"→ 切段掉头，
  #      用户截图原话「差一点点就要碰到梯子了结果马上回头」，
  #      而它**根本没机会爬梯子**。
  #    💡 调**大** → 更早切段（终点在高处的图会在半路就切，
  #       本图设 12 时"爬到一半就掉头往下爬"）；
  #       调**小** → 必须真爬到顶才切段（本图 3 = 爬到 y≤96）。
  #    💡 填 **0 = 关掉本层**（退回老行为：只看 x）。
  #    ⚠️ 若某张图的终点确实**够不着**（爬不上去/跳不上去），设太小会让角色
  #       一直在该段打转（watchdog 会在 10s 后触发脱困，不会真死住）——
  #       那种情况把本值往上调，或检查该图录制的终点是否合理。
  #    💡 平坦路线（终点与人同高，Δy≈0）**完全不受本项影响**。
  goal_reach_y_tol: 3

  # 🚧 goal 像素过滤（2026-10-14 加，用户 m08867 拍板）：当"离角色最近的路线像素"
  #    就是本段的 goal 圆点、而**高度差超过上面的 goal_reach_y_tol**（即
  #    `check_reach_goal` 已经判定"还在半路、暂不切段"）时，**本帧不要拿这个
  #    goal 像素当指令** —— 它的命令是 `none none goal`（什么都不做）。
  #    改法（**2026-10-14 修订，用户拍板**；两类像素分开处理）：
  #      ① **goal 像素**（`none none goal` 且 |Δy| > 容差）：在同一个搜索框里排除
  #         goal 重扫，换一个本帧真能用的像素；**换不到 ⇒ 一个都不剩** ⇒ 按
  #         "找不到路线像素"处理，交给**回正线 / 失联救援**接管（= 原行为，不动）。
  #      ② **另一层的纯横向像素**（`left/right none none` 且 |Δy| > 容差，朝它走也
  #         走不过去）：同样先重扫换一个**本帧真能用**的像素；**换不到 ⇒ 仍然按它走**
  #         （退回老行为），**不**交给回正/救援。留痕形如
  #         `仍按它走（cmd）—— 换不到别的可用像素，本帧不再交给回正 / 救援`。
  #    为什么 ② 不再"丢掉像素"（2026-10-14 真机取证 `log/MSBot_2026-10-14_16-51-02.log`）：
  #      该会话 `[路线·goal过滤]` 共 **46 次，46/46 全部以「本帧没有可用的路线像素 ⇒
  #      交给回正线 / 救援接管」收场**（"改用别的像素" **0 次**），其中 **45/46 是
  #      "另一层"**（goal 只 1 次），Δy 分布 4px=12 / 8px=17 / 9px=1 / 12px=11 / 24px=5。
  #      本图相邻路线行距只有 4~8px，而这里的容差复用了 `goal_reach_y_tol`(3) ⇒
  #      **人还在同一排、只是估计抖一下（4px）也被判成"换层"**，于是每逢节流上限
  #      （5s）就丢一次路线像素。后果（每分对照上一份 55 分钟会话）：`[回正]`
  #      2.2 → **14.2 次/分**、`[路线失联]` 0.9 → **3.4**、`[回正·小结]` 0.22 → **1.03**；
  #      8 条小结里 **6 条**是「超时/接不上退出 | 0.0s/0帧 | 一次都没走到起跳点 |
  #      离回正线 22~80px、**离主线 0px**」—— 即进回正那一帧主线其实就在 0px（入口吃的是
  #      被过滤后的空结果，出口吃的是 `_main_dist()` 的全图最近像素，**同一件事两个口径**），
  #      进去当帧就"接不上"退出并把那条回正线去武装 ⇒ 纯 churn（回正期间还不打怪）。
  #
  #    真机现场（`log/MSBot_2026-10-14_15-47-36.log`）：
  #      15:59:34–16:05:07（**5.5 分钟**）角色站在本段终点正下方 8px
  #      （全局 (48,86)、段3/4），每帧指令都是 `none none goal`；同时
  #      `check_reach_goal()` 因 `|86-78| = 8 > 3` 拒绝切段 ⇒ 「命令不让动 +
  #      段不让切」= 原地冻死。更糟的是**回正线进不来** —— 回正的门槛是
  #      "方圆内一个路线像素都找不到"，而这里"找到了"（goal 像素）⇒ 用户
  #      16:05 手绘的那条回正线在最该用它的时候用不上，最后是**用户手动停机**。
  #      对照：16:21:06 `[回正·小结] 成功回主线 | 1.9s/56帧 | (76,86)→(68,78)`
  #      —— 只要回正进得去，1.9 秒就能从 y=86 回到 y=78 的主线。
  #    同类僵持（同一条日志里 `指令(none none goal)` 的连续段）：15:59–16:05
  #      共 **25 段**、最长那段 5.5 分钟；上一轮（`..._15-07-02.log`）9 段、
  #      最长 76 秒 ⇒ **老问题，但这一轮长得离谱**。
  #
  #    💡 填 **0 = 关掉本层**（退回老行为：最近像素是谁就用谁）。
  #    💡 本层**不动** `goal_reach_y_tol` —— 那个值是治 2026-09-27
  #       "没爬到顶就切段"的回归的，动它会把老毛病放回来。
  #    ⚠️ 判据不可用时（`goal_reach_y_tol <= 0`、配置畸形、拿不到本段终点 y）
  #       本层自动**不生效**，退回老行为（fail-closed：宁可少管，也不乱丢像素）。
  goal_pixel_skip: 1

  endpoint_margin: 1          # 🛑 端点安全余量：把每段的终点朝**段内**收缩这么多像素，
                              #    让角色提前掉头，别走到平台物理边缘（2026-09-13 加）。
                              #    背景：主线是录到哪走到哪，很多人（包括我）会一路录到
                              #    平台边缘 —— 于是"终点"就贴在悬崖上。角色走到终点才
                              #    掉头，而掉头判定有一帧延迟 + 移动惯性，等反应过来已经
                              #    踩空掉下平台了（用户实测：录制时没事，挂机却会走出去）。
                              #    内缩之后，角色在离边缘还有 margin 像素时就掉头。
                              #
                              #    ⚠️★ **为什么现在是 1（2026-09-16 用户定，原来 4）**
                              #    原来取 4 的依据是"过冲量约 2px，内缩量必须明显大于过冲
                              #    才有效"（2026-09-13 实测）。而**过冲的根因是延迟** ——
                              #    用户 2026-09-16 明确："掉坑是延迟的问题，延迟修好了，
                              #    不太需要担心掉坑；而且没人会把路线录到那么极限。"
                              #    ⇒ 不再需要留这么大余量。
                              #    代价（实测）：margin=4 时你画的终点 80/48 被缩成 76/52，
                              #    **白吃掉 8px**；改成 1 之后只吃掉 2px。
                              #    本图巡逻行程实测：**24px → 30px**（你画的整条是 32px）。
                              #    掉落的防线仍在：`_near_seg_goal` 的 reach 上限三（1px）
                              #    + 可选的 `edge_guard` 地理围栏。
                              #    设 0 = 不内缩（终点就是你画的那个点）。

  edge_guard: false           # 🛑 平台边缘**硬**保护（2026-09-13 用户点名要的功能）
                              #    ★ 2026-09-15 先关掉，做一次真机实验（理由见下）。
                              #    背景：用户原话「没有平台边缘保护，挂机却会走出主线，
                              #    掉到平台下面」。终点内缩 / reach 封顶 / 切段重新武装
                              #    这些都是**软**保护 —— 靠状态机算得对不对；掉帧、
                              #    坐标识别抖动、打怪位移都能让角色一帧冲出好几像素，
                              #    软保护算得再准也追不上。这道围栏是**绝对地理围栏**：
                              #    不管状态机怎么想，只要这一步会把角色带出「主线路线
                              #    像素的 x 范围」，就把左右方向掰回来（left→right /
                              #    right→left）。命中时日志会打「[边缘保护] …」。
                              #    ⚠️ 走回正线（is_using_home_route）时**不生效** ——
                              #    回正线本来就要往平台外走，干预会把角色按在坑底。
                              #    设 false = 关掉（只留软保护）；读值非法时按 true 处理。
                              #
                              # ── ★ 2026-09-15 为什么先关掉（真机实测 + 算过）──────────
                              # 帧率从 3.8 提到 15~17 fps 后，单帧位移从 6px 降到 **2px**
                              # （日志原话「一帧约走 2px」）。而这道围栏要留的余量 =
                              # **指令延迟期间的位移**（截图→主循环→键盘 约 3 帧）
                              # = 3 × 2px = **6px**；两边各留 6px = **12px**。
                              # 本图路线宽度只有 **10px**（全局 x 94~104）→ **几何上放不下**。
                              # 实测症状：角色 3 分钟（2032 帧）只在 x=98~100 之间来回，
                              #   [边缘保护] 在 98/100 两个位置各挡一个方向 → 2px 极限环，
                              #   [is_player_stuck] 每 10 秒报一次（共 7 次）。
                              # ⇒ 这不是参数没调好，是"保护要的余量 > 平台本身"。
                              #   所以先关掉，验证「靠路线自己掉头 + 回正线兜底」够不够。
                              # 💡 如果掉得太频繁，再回来试**放宽版**（而不是原样打开）：
                              #   edge_guard: true + edge_guard_inset: 0 + edge_guard_react_frames: 1

  edge_guard_row_tol: 2       # 📐 围栏按**行**取值时的 y 容差（像素）。
                              #    围栏只用「角色当前 y ± 本值」这几行的路线像素算
                              #    x 范围 —— 因为地图常有上下两层平台，把下层的 x
                              #    也算进来的话，在上层走到边缘时围栏就不生效了。
                              #    2 = 认角色脚下 ±2 行（小地图像素很粗，2 行已够）；
                              #    调大 → 围栏更宽（可能把上下层连成一片，保护变松）；
                              #    调小 → 更严，但角色在斜坡/台阶上可能取不到像素。
                              #    ⚠️ 取到的行像素 < 2 个时**不启用**围栏
                              #    （防止角色在梯子/空中时被误按在原地）。

  edge_guard_react_frames: 3  # ⏱️ 围栏往前看几帧的位移（反应延迟补偿）。

  # 🛡️ 平台边缘安全余量：把围栏边界往**里**收这么多像素（2026-09-14 加）
  #    值越大 → 活动范围越窄、越不容易掉下去；**填 0 = 不收**（老行为）。
  #    为什么需要：角色跳回平台时落点会偏 ±4~6px（跳跃保留水平速度，实测），
  #    窄平台上这点偏移就足以让它掉出去；收一圈后落点偏了也还在安全区内。
  # ⚠️ 跟上面的 endpoint_margin（**段终点**内缩）不是一回事：
  #    那个管"走到哪掉头"，这个管"走到哪被拦住"，两者可叠加、不冲突。
  # 💡 建议：窄平台 2~3，宽平台 0。可在界面「高级设置 → 路线」里直接改。
  edge_guard_inset: 2

  # 🐜 「窄平台降级」阈值（2026-09-15 加，用户点名要）
  #    相邻两段终点的间距**小于**它 → 判定"这条路不值得来回巡逻"。
  #    背景（真机实测）：本图巡逻线只有 10px 长、两段终点只差 4px，
  #    切段判定的容差被 `(gap-2)//2` 压到 1px → 角色只能在 98~100 之间
  #    **来回蹭 2px**：既走不动，又每 10 秒触发一次看门狗"卡死"
  #    → 随机脱困指令把角色踹到别处（实测随机到 jump，跳到上一层平台）。
  #    降级后的行为：
  #      ① 不再来回蹭（站着面向最近的怪、正常出招）
  #      ② 不判卡死 —— **但只限"画面里没有认出来的怪"时**；
  #         附近有怪却不打，那是**真卡死**，照样交给脱困逻辑救。
  #    💡 单段路线不受影响（靠 pingpong 走完全程，本来就不蹭）。
  #    💡 调大 → 更多图会降级；调小 → 只有极窄的图降级；**填 0 = 关掉这个功能**。
  #
  # ⚠️★ 2026-09-27 由 24 下调到 15（用户实测：正常路线被误判成"不值得巡逻"）
  #   现场：用户在「废都南方工地」录的往返线，两段终点间距算得 **23px**
  #     （判据取 max(|Δx|,|Δy|)，见 MapleStoryAutoLevelUp 的 _seg_goal_gap；
  #       该图 Δx≈24、Δy≈24，内缩后为 23）。
  #   而阈值是 24 ⇒ **23 < 24 判"窄"** ⇒ 引擎主动"站着不动"，
  #     日志 `[窄平台降级] ... 只差 23px（阈值 24px）`、指令一直 `none none none`，
  #     用户误以为"按 F1 不启动挂机"。
  #   ⇒ 23~24px 的用户路线是**正常可走的**（那张图路线总跨度 30px），
  #     不该被拦。15 能放行这类路线，同时仍拦住原意要治的极端情况（4~10px 蹭）。
  #   ⚠️ 别调到比 10 还小：本判据的起因就是"10px 路线在 2px 里来回蹭"，
  #     阈值低于它等于把那个老问题放回来。
  patrol_min_gap: 15

  # 🎯 回正**成功后**先走回安全区中心，再恢复正常巡逻（2026-09-14 实测加）
  #    为什么：角色跳回主线时会**横移约 4px**，而回正期间边缘保护是**关掉的**
  #    （回正线本来就要往平台外走）→ 落点完全没人管。实测落到 106（安全区
  #    94~104 之外）那次，**同一秒就又掉下去了**。先回到中心，落地位置永远安全，
  #    也给后续巡逻留出到边界的距离。
  #    失败退出（超时 / 接不上）时**不**归位 —— 人还在坑底，归位只会跟回正打架。
  home_recenter: true          # false = 关掉归位（回到老行为）
  home_recenter_frames: 30     # ⏱️ 归位最多走几帧还没到中心就放弃（防把角色锁死）

  # 🎯 回正**起跳前先停稳**（2026-09-14 实测：**已证明有害，默认关闭**）
  #    起因：回正线画的是"走到主线正下方原地跳"，但角色是跑着进来的，
  #    跳跃保留水平速度 → 实测落点 = 起跳点 ± 4~6px，一偏就贴到平台边缘。
  #
  #    ❌ 但"先停稳再跳"这条路走不通，实测两次失败：
  #       ① 松开方向键后角色**仍会滑行**，根本停不下来 →
  #          陷入「刹车 → 滑走 → 再刹车」死循环，回正从 0.6~3.2s 成功
  #          恶化成 8.3s / 8.5s **超时失败**（走到起跳点 5 次都没跳上去）。
  #       ② 更致命：**两个平台中间有缺口时必须"前跳"**（带着速度跳才能过去），
  #          无差别刹车会让那种地形永远过不去。
  #
  #    ✅ 所以默认关。留着代码是为了以后真要做"选择性刹车"时能有个起点 ——
  #      但那必须先能区分「垂直上跳」和「跨缺口前跳」两种地形，不能一刀切。
  home_jump_brake: false       # ⚠️ 默认**关**：true 会破坏跨缺口地形
  home_jump_brake_frames: 3    # ⏱️ 最多等几帧（等太久就照跳，防卡死）
                              #    为什么要它：从「截图看到角色位置」到「按键真的生效」
                              #    要穿过 截图 → 主循环 → 键盘 三个线程，每个线程各占
                              #    一帧，所以指令生效时角色已经又走了几帧的距离。
                              #    围栏只往前看 1 帧是不够的 —— 10 FPS 时实测过冲
                              #    ~8.8px（平台才 14px 宽），必然冲出边缘。
                              #    3 = 按 3 帧的位移做预判（默认三个线程各 1 帧）。
                              #    ⚠️ 调大 → 更早掉头（更不容易掉，但巡逻范围更小）；
                              #       调小 → 巡逻范围大，但可能来不及刹住。
                              #       宁可调大：用户明确说过「一切以不掉落为优先」。

  rescue_range: 40            # 🛟 Route-lost rescue radius. After being bumped/attacked, the player can
                              #    easily drift farther than search_range from the route line; then no
                              #    color code is found, the command goes blank and the character just
                              #    stands idle until the watchdog barks (2026-09-12 实测：干站发呆).
                              #    When NOTHING is found within search_range, rescan with this radius
                            #    to re-capture the route. Kept separate from search_range because a
                            #    wide normal search could latch onto a nearby parallel route segment
                            #    and steer onto the wrong branch.

  # ── 回正线（route_home.png）v0.9 **第二版**：删掉「落点锚」，改比两条线的距离 ──
  #    判定只有一句话（进入 / 保持 / 退出**同一个表达式**，口径唯一）：
  #        d_home = 角色到最近「已武装」回正线像素的曼哈顿距离
  #        d_main = 角色到最近主线像素的曼哈顿距离（**全图**，不受 search_range 限制）
  #        d_home < d_main - home_dist_tol  →  进 / 保持回正，沿回正线走回主线
  #        否则                             →  主线优先（继续巡逻，或退出回正）
  #
  #    ⚠️ 为什么必须比两条线、不能写「不在主线上就回正」：坑底离主线只有 6px <
  #       search_range(10) → 引擎"透过地板看得见主线" → 判定在主线上 → 永远不进回正
  #       （第一版修掉的坑 1，别把它复活）。
  #
  #    🚧 **2026-10-14 加入口可达性闸**：进入回正前还要确认"最近的回正线像素在
  #       `rescue_range`(40) 以内"。因为**进去之后**的路线搜索只有 `search_range`(10) /
  #       `rescue_range`(40) 两个框，而 `_home_dist()` 量的是**全图**最近像素 ⇒ 线在
  #       22~80px 时会"进去了、当帧一个像素都搜不到 ⇒ 立刻『回正线接不上』退出 + 去武装"，
  #       只剩 churn（真机 `log/MSBot_2026-10-14_16-51-02.log` 里 6/8 条小结就是这种
  #       「0.0s/0帧、一次都没走到起跳点」）。够不着时**不进去**，留痕形如
  #       `[回正] 有可用回正线，但最近像素在 Npx 外（搜索 10px / 救援半径 40px 够不着）⇒ 不进去`
  #       （10s 节流），指令清成 none、照常打怪；人走近那条线附近会自动进去。
  #
  #    第一版已删除（第二版不再有这些概念）：落点锚色码 127,0,127、触发半径 R、
  #    离主线 D、方向侧判据、home_return_range / home_return_min（新方案退出不用半径，
  #    留着是没有消费者的死配置）。

  home_dist_tol: 2         # ⚖️ 比较容差。只有角色**明显**更靠近回正线时才进回正。
                           #    验算（废都南方工地）：坑底中点 0 < 6-2 ✅；坑底两端 0 < 8-2 ✅；
                           #    主线上巡逻 6 < 0-2 ❌（不误进）；竖段中段 0 < 3-2 ✅（不提前退出）；
                           #    回正线终点贴主线时 0 < 0-2 ❌ → **相等时主线优先，自动退出回正**。
                           #    ⚠️ 填负数视为"没配"，会回落默认 2。

  home_min_cover_span: 5   # 🚫 判废④：起始段（离主线最远那批像素）的 **x 跨度** 下限。
                           #    只画一条竖线时跨度 = 1 → 判废（角色掉在坑的左右两边接不住，
                           #    见 PRD 2.4 的反例）。回正线必须画成 L 形：先沿坑底横着铺一段。
  home_cover_far_tol: 2    # 📐 「离主线最远那一批」的容差：d_main(p) >= dmax - 本值 才算起始段。
  home_goal_mainline_tol: 1 # 🚫 判废⑤：终点（goal）像素到主线的最小距离上限，**超过就判废**。
                           #    ⚠️ 为什么是判废不是警告：终点离主线 5px 时，角色站上去仍是
                           #       d_home=0 < 5-2 → 永远退不出回正，只能干等 8s 超时（= 第一版
                           #       QA-18 那个洞在新方案里的对应物）。留容差等于把洞原样保留。
                           #    ⚠️ 2026-09-13 从 2 收紧到 1（QA 发现）：goal 是半径 1 的十字
                           #       （5px），容差 2 时竖段画在 x=107/108（平台外）也会因十字碰到
                           #       平台边缘 (106,122) 而**放行** → 角色跳上去落空。收到 1 能多拦
                           #       一部分临界；x=107/108 这个盲区靠本判据区分不了（十字必然碰
                           #       到边缘），由手绘器「竖段画在平台外」的黄字提示兜住。
  home_min_return_span: 5  # 🚫 判废③：起点→终点的曼哈顿距离 < 5px 视为废线（原地起头原地收尾）。

  home_min_leave: 0        # 🚧 保险丝（**默认关闭**）：进入回正后离开进入点 ≥ N px
                           #    才允许判定"已回到主线"。
                           #    ⚠️ 为什么默认 0：新方案靠「相等时主线优先」自动处理抢跑，
                           #       理论上不需要。实测若发现"一进就出"的抖动，再打开到 6。
  home_min_frames: 0       # 🚧 保险丝（**默认关闭**）：或已回正 ≥ N 帧也算门开了（与上面取或）。
                           #    抖动时打开到 15（≈0.5s）。

  home_timeout: 8          # ⏱️ 回正超时（秒）。超时 → 退出回正、交还给打怪逻辑，
                           #    并且**这条回正线**去武装（需离开它的范围 4px 或 30s 才重新武装）。
                           #    ⚠️ 必须 < watchdog.timeout(10)：超时出口一定要先于看门狗，
                           #       否则"回正接不上"会被看门狗当成卡死、抽随机动作乱走。
                           #    ⚠️ 为什么必须去武装：新判定天然不带 armed 概念，超时退出后
                           #       角色**仍站在坑底**（d_home 还是 0）→ 下一帧立刻重进 →
                           #       home_enter_t 每帧归零 → 8s 超时退化成"每帧重置" →
                           #       回正期间不打怪 = 实测过的「既不走也不打」死锁。
                           #    ⚠️ **填 0 不会关掉它**，会回落默认 8（关掉 = 死锁回来）。
  home_rearm_margin: 4     # 🔁 去武装后重新武装：角色离开这条线的**包围盒** ≥ 本值。
  home_rearm_timeout: 30   # 🔁 去武装兜底：30s 后无条件重新武装（防永远武装不回来
                           #    = 这条线被静默删除）。**填 0 不会关掉**，回落 30。
  home_reenter_lock: 10    # 🧊 回正**失败**（超时 / 接不上）后的冷静期（秒）。
                           #    这段时间内**任何**入口（新判定 + 老兜底）都不准进回正，
                           #    老老实实打怪；到期后再试一次。
                           #    ⚠️ 为什么必须有：超时退出那一帧角色仍在坑底，
                           #       新判定 d_home < d_main - tol **仍然成立** → 下一帧立刻重进
                           #       → 8s 超时永远走不到 → 实测 120/120 帧卡在回正里、既不走也不打。
                           #    ⚠️ **填 0 不会关掉它**，会回落默认 10：
                           #       冷静期这个逃生口会让超时出口重新变成死循环，弊大于利。

  # ── 落点横段的「原地跳」区间（jump band，2026-09-14 加）─────────────────
  #    上下两层平台的地形里，下层（坑底）的回正线通常画得比上层主线**长**：
  #    主线横跨 x 20~40，坑底回正线却横跨 x 15~45。角色在 x=15~25 附近往左跳，
  #    大概率**跳不到平台上**（右边同理）—— 只有站到**主线的正下方**原地起跳
  #    才上得去。旧规则是「整条横段汇聚到拐角」：只有拐角那一列能起跳，而角色
  #    在坑底一帧能走好几像素，根本落不上去 → 在横段两端之间来回震荡；极偶尔
  #    蹭到那一列时人还在横向移动 → 起跳带着横向惯性 → 斜着跳、跳上平台又跳
  #    出去（用户实测：「有很小的几率能跳回去」「位置错了，在平台边缘正下方往
  #    反方向跳」）。
  #    所以横段改成**三态分区**：区间左边往右走、区间内**原地跳**、区间右边往左走。
  #    ⚠️ 这两个值只在**手绘保存**时用一次（把色着进 route_home.png）；
  #       引擎运行期一个字节都不读 —— 改完要**重画**回正线才生效。
  home_jump_band_max_drop: 8  # 📏 认「头顶上方主线」的最大落差（行）：只看
                              #    pit_y - max_drop <= y < pit_y 这段里的主线像素
                              #    （pit_y = 落点横段所在的 y，即坑底）。
                              #    背景：比坑底高太多的主线是**上一层平台**，跳上去
                              #    也够不着，算进区间会让角色在够不着的地方起跳。
                              #    8 ≈ 一次普通跳能上的高度（怀旧服普通跳约 4~6px，
                              #    实测废都南方工地落差 6px）留了余量。
                              #    调大：会认到更上层的主线 → 区间变宽、更容易起跳，
                              #      但也更容易在"够不着的平台正下方"反复空跳；
                              #    调小：区间变窄（只在正正下方才能跳），
                              #      调过头（< 实际落差）会**一个像素都认不到**
                              #      → 算不出区间 → 自动回落成老的"汇聚到拐角"行为。
                              #    设 0 = 只认与坑底同一行的主线（基本等于关掉）。
  home_jump_band_inset: 5     # 🛑 「原地跳」区间距**平台边缘**的安全余量（像素）：
                              #    区间两端各向内缩这么多，角色绝不会贴着悬崖起跳。
                              #    背景（2026-09-14 实测，废都南方工地）：
                              #      主线 y=122 横跨 x 92~106（平台只有 15px）。
                              #      inset=1 → 跳跃区 = x 93~105，**几乎铺满整条横段**
                              #        → 角色在坑底**第 1 帧原地起跳、起跳 x = 落点 x**，
                              #        落在 90~93 就在平台外跳，落在 106~112 就一路走到
                              #        105 跳（距右缘只剩 1px）—— 用户实测「起跳很晚、
                              #        极大概率跳不上平台」就是这么来的。
                              #      inset=5 → 跳跃区收成 **x 97~101（宽 5px）**，
                              #        距平台左缘(92) / 右缘(106) **各留 5px** 余量。
                              #        横段两端（x 94~96 → right、x 102~108 → left）
                              #        会把角色**汇聚到中段**再起跳：
                              #        实测落点 90~112 的起跳 x 全部落在 97~101，
                              #        最偏的也距边缘 5px（1px/帧 和 2px/帧 两档都过）。
                              #    ⚠️ 平台短时这个值是**决定性**的（本项目 15px 平台，
                              #       inset 差 1px 就是"贴边跳"和"中间跳"的区别）；
                              #       平台长时留 5px 余量同样安全，不用调回去。
                              #    设 0 = 不内缩（贴边起跳，平台边缘容易踩空）。
                              #    ⚠️ 平台特别窄、缩完 x0 > x1 时，calc_jump_band 会
                              #       先把 inset 压到「至少留 3px 宽」；压完还是退化
                              #       → 返回 None → 自动回落成老的"汇聚到拐角"行为。
                              #    ⚠️ 填负数 / 不填 → 一律回落**默认 5**（不是 1：
                              #       回落成 1 等于把"跳跃区铺满横段"这个坏值放回来）。

  # 🎨 Color-coded(RGB) actions for route navigation
  # "<left-right command, up-down command, action>"
  color_code:
    "255,0,0": "left none none"         # 🔴 Red
    "0,0,255": "right none none"        # 🔵 Blue
    "255,127,0": "left none jump"       # 🟠 Orange
    "0,255,255": "right none jump"      # 🟦 Cyan
    "127,255,0": "none down jump"       # 💚 Lime
    "255,0,255": "none none jump"       # 💜 Magenta
    "0,255,127": "stop stop stop"       # 🟢 Light green
    "255,255,0": "none none goal"       # 🟨 Yellow
    "255,0,127": "none up teleport"     # 🌸 Pink
    "127,0,255": "none down teleport"   # 🟪 Purple
    "0,127,0": "left none teleport"     # 🟩 Dark green
    "139,69,19": "right none teleport"  # 🟫 Brown

  # 🎨 Color-coded(RGB) actions for up and down
  color_code_up_down:
    "127,127,127": "none up none"       # ⚪ Gray
    "255,255,127": "none down none"     # 🟡 Light yellow

  # ⚠️ 第二版**没有**第三种色码表：第一版的 `color_code_home_anchor`
  #    （127,0,127 落点锚）已随「落点锚」概念一起删除。
  #    旧版 route_home.png 上残留的 127,0,127 像素，引擎每次开跑会自动涂黑
  #    并打一行中文提示（见 src/utils/home_route.py 的 wipe_legacy_anchor）。
  #    原因：该色不在上面两张表里 → 角色站上去时 get_nearest_color_code 取不到
  #    → 那一帧没有指令 → 站着不动（不报错，极难查）。

  # 🪜 「真的在爬」的竖向进展窗口（秒，2026-10-14 加，用户拍板 A）──────
  #    背景：`is_on_ladder` 这面旗子**只进不出**（清除的两条出口都要求横向移动，
  #      见 src/engine/MapleStoryAutoLevelUp.py 的跟踪块），于是怪逻辑的绳/梯让路
  #      被粘滞旗标一路吃掉。示范录制实测（debug/demo，6262 帧 / 226s）：
  #        · 梯上帧 2749（43.9%），其中 75.5% 路线根本没给 up/down；
  #        · 整段全局 y 零变化的梯上段 44/105（1048 帧），人在这些帧里出手 910 次，
  #          而引擎梯上出手率 **0.0%**（平台 16.5%）。
  #    ⇒ 本值定义："旗标为真时，最近这么多秒内**小地图全局 y 变过**才算真在爬"，
  #      过期就不让路（怪逻辑照常靠近/出招）。路线给 up/down 的那一路**不受本值影响**
  #      （它始终让路：拉绳只由路线负责，见让路块的长注释）。
  #    取值依据（同一份示范录制，跨段连续仿真）：0.7s 时真爬段让路 71.5%、
  #      粘滞段只让路 18.1%（老行为是 100%）。调大 → 更保守（更少打架）；
  #      调小 → 更灵敏（粘滞帧放得更多，但爬梯中被打断的窗口更短）。
  #    ⚠️ 填 **0（或负数）= 关掉本层**，退回老行为（旗标为真就一直让路）；
  #      小地图全局坐标读不到时也自动退回老行为（fail-closed：宁可少打几下，
  #      也不能把角色吊在绳子上 —— 2026-10-13 真机现场）。
  ladder_still_s: 0.7

  # 🪜 绳梯脚下"蹭一下"自救（2026-10-14 加，用户拍板 D）──────────────────
  #    背景（真机日志 log/MSBot_2026-10-14_15-07-02.log，A+B 已上线那一轮）：
  #      · 15:16:40→15:17:25 停在 全局(78,78)、15:32:22→15:33:05 停在 (76,78)，
  #        角色按着 up **45~50 秒**爬不上去；同段时间里
  #        `[按键状态] 指令(none up none) 近5秒实际发键 94~97 次` 证明键一直在发，
  #        伴随 `[路线够不着] … 连续 180 帧没能靠近` 与 `[is_player_stuck]` 报警。
  #      · 机制：route1.png 上那根绳子是干净的 1px 竖列（x=78, y=71..78），角色停在
  #        列上时最近像素就是 up 像素 ⇒ 引擎发**纯 up**；而能把角色挪进绳子的
  #        横向补位写在 `if self.cmd_move_x == "none" and self.is_on_ladder`
  #        —— 旗标只在"纵向真动过"时才置真 ⇒ **不动 ⇒ 旗标假 ⇒ 只发 up ⇒ 更不动**。
  #      · 对照：真人示范录制里人在 x=78 只按 up 就上去了（真位置正好压在列上）；
  #        机器人同一轮 65 次成功上爬的样本里常见 `left up none` / `right up none`
  #        —— 就是**边走边按上**（用户 2026-09-27 原话："还得带个方向键"）。
  #      · 跨轮取证：同样的"按着 up 且坐标完全不动"在 A+B **之前**就有
  #        （02:20 轮 03:39:52→03:40:32 ≈45s @(256,78)、10:03 轮 ≈30s @(112,78)/(68,54) 等）
  #        ⇒ 与本分支 A/B 无关，是绳梯脚下早就存在的自锁。
  #    ⇒ 本值定义："路线要 up/down、又不在梯子上、且**这么多秒没有竖向进展**"
  #      就开始每隔 rope_nudge_cycle_s 蹭 rope_nudge_ms 毫秒（左右交替，up 一直按着）。
  #      竖向进展直接复用 A 那枚戳（只认小地图全局 y 变化）。
  #    ⚠️ 填 **0（或负数）= 关掉本层**，退回老行为（一直站着按 up）。
  #      真在爬（is_on_ladder 为真）时**绝不蹭** —— 在绳子上按左右会松手掉下去。
  rope_nudge_s: 1.0
  # 每次蹭多久（毫秒）—— 短促，别把角色蹭过头或蹭下平台。
  rope_nudge_ms: 120
  # 两次蹭之间隔多久（秒）；蹭的那一下过后剩下的时间只按 up（等游戏判定）。
  rope_nudge_cycle_s: 0.6
  # 蹭多久还没进展就**放弃**（秒，从 rope_nudge_s 之后算起）——
  # 之后退回老行为，交给既有的 [路线够不着] / [is_player_stuck] 报警
  # （用户 2026-09-15 选的 on_stuck: alert 只报不动，本层不去抢它的活）。
  rope_nudge_max_s: 6.0

  # ⏱️ 爬绳"上不去就算了"的窗口（秒，2026-10-14 加，用户 m10830）────────────
  #    背景（真机取证 log/MSBot_2026-10-14_17-40-51.log 段11 = 19:18–21:49 152 分钟）：
  #      · 出招本身不慢：`[出招·延迟]` p50 **33ms**（怪进攻击框→出刀约一帧）。
  #      · 慢的是"该不该打"：>10s 的打怪空档 105 次合计 **2726s（占 30%）**，
  #        其中 **104 次含 `[绳/梯]` 事件**；**87 次（1540s = 会话的 17%）角色
  #        "几乎没动"**（净位移 ≤8px、总路程 ≤20px），而这 87 次里"发键 0 次"的
  #        采样是 **0/317**（键一直在发、90~96 次/5s @fps 20）⇒ 一直按着 up
  #        顶着绳/墙，同时**怪逻辑被让路块整段静音**（最长一次 **211 秒**）。
  #      · 人眼在这种场景里"看一眼、够不着就干别的去"，不会盯着一根上不去的
  #        绳子按 211 秒 —— 本值就是把这个"放弃"变成可配置的秒数。
  #    ⇒ 判据：路线要求 up/down **已持续 ≥ 本值**，且同期小地图全局 y 没有竖向
  #      进展 ⇒ 判定"这根绳上不去"，暂停爬绳 **本值** 秒。暂停期间：
  #        · `_ladder_yield()` 不再让路 ⇒ **怪逻辑恢复**（会靠近/出招）；
  #        · 路线侧把 up/down 压成 none ⇒ 不再死按方向键；
  #      一旦真出现竖向进展（小地图全局 y 变过）⇒ **立刻取消暂停**，
  #      控制权马上还给路线（不许"人已经在爬了、怪逻辑还回来抢"）。
  #    ⚠️ 填 **0（或负数）= 关掉本层**，退回老行为（路线给 up/down 就一直让路）；
  #      值 >120 也当关掉（明显写错，不猜）；小地图全局坐标读不到时同样自动关掉
  #      （fail-closed：测不到进展就不敢替用户放弃）。
  #    调大 → 更耐心（更晚放弃、更长时间保持"路线优先"）；
  #    调小 → 更早放弃（更早把控制权交给怪逻辑）。
  rope_stuck_s: 8.0

  # 🪜 爬梯"走完"：在梯子上、路线这帧没给上下时，替路线补一个竖向指令（2026-10-15）
  #    来源：用户 m11669 原话「上梯子要走完，不要检测怪了，现在会走上梯子后，
  #    发现有怪就卡在梯子上」。
  #    · 机制（真机取证 log/MSBot_2026-10-15_00-36-31.log，26 分钟）：
  #      角色挂在梯子上时**按左右键是不动的**（人还挂在绳上），只有 up/down 能走；
  #      而路线这帧未必给竖向 —— 最近的可走像素可能是横向的，同列的 up 像素
  #      也可能被"防地面伪灰"判掉 ⇒ 指令里 y=none。
  #      该日志里"全局坐标连续 ≥5s 不动"共 **8 段，全部是竖向指令 0/N 帧**：
  #      30s @(210,60)（竖向 0/6 帧、同期 5/6 帧有怪）、15s @(78,74)、15s @(124,64)、
  #      15s @(180,64)（其间 `旗标粘着：103248ms`）、10s @(198,76) 等。
  #      同期 `_ladder_yield()` 因为"没在爬"而放行 ⇒ 怪逻辑站桩打怪。
  #    ⇒ 判据：`is_on_ladder` 为真、且本帧路线**没给** up/down ⇒ 补上"路线最近一次
  #      给的竖向"（默认 up）。补上之后 `_ladder_yield()` 的"路线给 up/down ⇒
  #      始终让路"自然生效 ⇒ **怪逻辑全程静音**（正是用户要的"不要检测怪了"）。
  #    ⚠️ 不抢的两个窗口：① P0 的"爬绳放弃"暂停期（那几秒归 route.rope_stuck_s）；
  #      ② 自己的冷却期（补满 ladder_finish_s 秒、小地图全局 y 一直没动 ⇒
  #      判定"按上去也没用"，冷却同样长的时间，日志 `[爬梯] …`）。
  #      退出仍靠既有判据：引擎判定离开梯子（全局 x 变化 ≥ route.ladder_leave_x、
  #      或屏幕 dx > 3）⇒ 下一帧自动不再补。
  #    ⚠️ `ladder_finish` 填 false（或 `ladder_finish_s` ≤ 0）= **关掉本层**，
  #      逐字退回老行为（路线不给竖向就不按上下）。值 >120 当写错，用出厂 6.0。
  #    调大 → 更有耐心（更久才放弃补竖向）；调小 → 更早放回路线/绳梯自救。
  ladder_finish: true
  ladder_finish_s: 6.0

watchdog:
  # 🐶 Watchdog
  # This feature monitors your character's movement.
  # If the player stays in the same spot for too long, the watchdog will "bark"
  # and trigger a random action (defined in `color_code`) to help break the stuck state.
  # The other feature is last attack watch dog. It check if the player doesn't attack for too long.
  # If so, consider the player is stuck and perform recovery action 
  range: 10            # 🥶 Movement threshold (in pixels). If the player moves less than this, it's considered stuck.
  timeout: 10          # ⏱️ Time limit (in seconds). If the player stays still for this long, a random action is triggered.
  on_stuck: alert      # 🚨 判定卡死后**做什么**（2026-09-15 用户定，见下）
                       #
                       #   random = 老行为：从 color_code 里**均匀抽**一个动作
                       #            （`random.choice(["left","right","none"]) × ["down","none"] × ["jump","none"]`
                       #            共 12 种，**完全不知道悬崖在哪**）。
                       #            2026-09-15 用户实测判它"没有好处只有坏处"：
                       #            ① 在窄平台上乱抽 = 直接掉下去（实测抽到 `right none jump`，
                       #               而右边正好是悬崖）；
                       #            ② 它把真因**盖住**了 —— 13:58 那次 `stuck 10.08s` 后随机跳，
                       #               把角色从 (100,122) 踹到 (100,118)，症状从"在原地蹭"
                       #               变成"跳到另一层"，日志上看"它动了"，反而更难查。
                       #   alert  = ★ 默认：**不乱动**（保持本帧逻辑给的指令），
                       #            改为**弹置顶提示窗** + 打醒目日志，让人来处理。
                       #            代价：真卡住时不会自己脱困（但你会立刻知道）。
                       #   none   = 什么都不做（只留 is_player_stuck 那条 WARNING）。
                       #
                       # ⚠️ 取值非法 / 缺键 → 一律回落 **alert**（最安全：宁可不动也别乱动）。
                       # ⚠️ 为什么保留 random 这个选项：某些地形（比如掉进没录过回正线的坑）
                       #    随机动一下是唯一的脱困希望 —— 换图时可以先试 random 对比。
  alert_cooldown: 60   # 🔔 alert 模式下，两次弹窗的最短间隔（秒）。防"还卡着 → 每 10 秒弹一次"刷屏。
                       #    注意：**弹窗没关之前不会再弹第二个**（模块内单实例），本值只防"关了又弹"。
  attack_grace: 5      # ⚔️ 刚出过招的宽限秒数（2026-09-12 加）：这段时间内**不算卡死**。
                       #    打怪时角色本来就不该动（技能前摇 + 冷却），连续打同一只怪的
                       #    位移经常 < range(10px) → 没有这条就会被误判卡死、抽随机动作
                       #    乱走，把正在进行的战斗打断。
                       #    取值要 > 技能冷却（directional 0.9s / aoe 0.05s），
                       #    又要 < timeout(10s) 以免真卡住了救不出来。
                       #    ⚠️ 这是「删掉定点模式、全归巡逻」的前提之一 —— 原来靠
                       #       「站安全点内豁免」兜住站桩打怪，那是 stand 模式专属的。
  last_attack_timeout: 1200 # ⏳ Maximum time (in seconds) to not perform attack action
                            #    超时后统一「按回城键 + 停止脚本」（换频道动作已移除）

minimap:
  # 🗺️ Mini-Map
  # The minimap appears in the top-left corner of the game window.
  # It is used to estimate the player’s current location in the world.
  player_color: [136, 255, 255]   # 🟡 BGR value of the yellow player dot on the minimap
  debug_window_upscale: 4         # 🔍 Zoom factor for the route debug image (for visualization only)
  offset: [0, 0]                  # 📐 Don't set this unless playing on global server

# 巡逻模式（patrol）已于 2026-09-10 移除：挂机要的是稳定，正式方案是「打怪 + 路线」，
# 不再保留「不依赖识别、纯来回走」的兜底模式。

route_recoder:
  # 🎥 Route Recorder
  # The route recorder is a standalone tool that helps generate `map.png` and `route*.png`.
  # It records the player's movement and actions, then saves them as a route map image.
  blob_cooldown: 0.15       # ⏱️ Cooldown in seconds between recording actions like 'jump' or 'teleport'
                            #     These actions are marked as a "blob" on the route map
                            #
                            # ⚠️★ 2026-09-27 由 0.7 下调到 0.15（用户实测需求 + 自检实证）
                            #   为什么必须下调：0.7 秒把**正常的连跳**也一起杀了。
                            #     实测（直调 RouteRecorder.paint_step）：
                            #       两次跳间隔 0.3s → blob_cooldown=0.7 只记 1 簇（第 2 跳
                            #       新增像素 0）；blob_cooldown=0 正常记 2 簇。
                            #     而"跳台阶 / 跳着爬管子"恰恰要求跳与跳之间就是 0.2~0.5s
                            #       ⇒ 录出来的线缺跳，机器人走到梯子底下只会按 up。
                            #   那当初为什么设 0.7：怕"一次跳被录成多颗 → 上平台又跳下去"。
                            #     实测证伪了这一前提 —— 一次跳画的是**一个 13 像素圆点**
                            #     （1 簇），本来就不会多记。真正的防连跳在**引擎端**
                            #     `key.jump_cooldown: 1.0`，不该由录制端承担。
                            #   现在这个值只做一件事：压住"同一瞬间被重复触发"
                            #     （pynput 抖动 / 一帧内多次回调），0.15 = 够用且不误伤。
  map_padding: 30           # 🖤 Padding (in pixels) added as margin around the edge of the map

  # ── 手绘回正线（v0.9）—— 纯鼠标在放大的小地图上画，不用真的掉下去一次 ──────
  home_draw_scale: 4        # 🔍 手绘画布默认放大倍数（268×187 → 1072×748）
                            #    1 个原图像素 = 4 个屏幕像素，鼠标 ±1 屏幕像素 = ±0.25 原图像素
  home_draw_scale_min: 3    # 🔍 滚轮下限 / 屏幕放不下时自动降级到的下限
  home_draw_scale_max: 6    # 🔍 滚轮上限
  home_draw_goal_radius: 1  # 🟨 手绘的终点（goal）盖章半径：1 = 5px
                            #    ⚠️ 为什么不是录制器的 2（13px）：13px 的黄点会吃掉
                            #       8px 短线的一大半，直接制造"一进回正就被判走完"的坑。
                            #       老录制器流程仍是 2（不影响，回正退出已不看 goal）。
                            # ⚠️ 第二版已删除 home_draw_anchor_radius（没有落点锚可盖）。

game_window:
  # 🪟 游戏窗口 —— 这里是**全部坐标的地基**，三个值都必须来自真机实测
  #
  # 采集方式：游戏开窗口模式（不要最大化、不要全屏）后跑
  #   python -m tools.measure_window            # 量 + 核对
  #   python -m tools.measure_window --write-config   # 按实测值直接改本文件
  #
  # 实测结论（2026-09-10，用 tools/measure_window.py + 已知尺寸对照窗口验证）：
  #   抓「窗口」得到的帧**含标题栏和 1px 窗口边框**，不是纯客户区：
  #     帧宽 = 客户区宽 + 2      （左右各 1px）
  #     帧高 = 客户区高 + 标题栏高 + 1（底部 1px）
  #   100% 缩放时标题栏实测 31px（上游写死 32，偏 1px）；换缩放比例要重量。
  #   引擎 get_img_frame() 先切掉 title_bar_height 行，再锚定左上角裁到 size，
  #   正好落在客户区上 —— 帧的像素坐标 == 客户区坐标。
  title: "冒险岛怀旧服"          # 🎮 窗口标题关键词（找窗口用；会排除资源管理器/桌面等外壳窗口）
  size: [768, 1366]             # 📐 客户区尺寸 [高, 宽]（不含标题栏）✅ 2026-09-10 真机实测一致
  coord_base_size: ~            # 📐 ui_coords 是在哪个尺寸下录的 [高, 宽]；~ = 同 size（推荐）
  title_bar_height: 31          # 📐 抓帧顶部要切掉的标题栏高度（**开发机**实测值；随系统变化）
  #
  # ⚠️ 关于 title_bar_height：这个值**不是全球通用常数**（issue #14 实锤）。
  #    标题栏高度是 Windows 按「主题 + 显示缩放 + build」算出来的**系统值**，
  #    每台机器都可能不同 —— 实测有用户机器是 27（比这里的 31 少 4px）。
  #    切多了会怎样：帧高 = 客户区高 + 标题栏 + 1，切 31 只剩 765 行、不够 768
  #    → 引擎/录制/试读**全部拿不到画面**（报「画面大小对不上」）。
  #    切多但没跨过阈值时更隐蔽：不报错，但**所有坐标整体上移几像素**，
  #    血蓝条 ROI 距底边本就只有约 4px，会连带读数不准。
  #    ⇒ 程序启动时会**自动实测本机标题栏**并与之比对：
  #         相差 ≤ 1px  → 用这里的值（正常机器行为零变化）
  #         相差 > 1px  → 按**实测值**裁剪，并在日志里打印【自适应】
  #         量不到窗口  → 退回这里的值，维持现状
  #    ⇒ 想让本文件永久适配你的机器，跑一次：
  #         python -m tools.measure_window --write-config
  #      它会量出真实值并改写本文件（之后日志里的【自适应】提示就不再出现）。

log:
  # 📝 日志埋点开关（排查用，随时可关）
  # ⚠️ 只影响"打不打日志"，**不影响任何判定逻辑** —— 关掉不会改变机器人行为。
  # ⚠️ 缺段 / 缺键 / 填了非布尔值 → 一律**默认开**（照 _edge_guard_step 的读法，
  #    不进 home_params / _HOME_PARAM_FLOORS，避免"想关关不掉"）。
  jump_trace: true       # 🔍 回正起跳埋点：进回正记起点、走到起跳点记一次、退出时打一行小结
  perf_trace: true       # ⏱️ 主循环性能埋点：每 5 秒一行，各阶段耗时降序（排查"帧率上不去"用）

system:
  # ⚙️ System Settings
  # Controls performance and behavior of core system threads.
  # ⚠️★ 2026-09-13 用户实测改（这条比前面几处逻辑修复都关键，别改回去）
  #   用户反馈：「明明角色到地方了还要等一会才能发送按键指令」——他是对的。
  #   原来主循环只有 10 FPS = **每 100ms 才决策一次**。角色实测约 44px/s，
  #   也就是从「走到终点」到「发出掉头指令」之间，角色已经又走过 **4.4px**，
  #   而平台只有 14px 宽、端点内缩后缓冲只剩几个像素 → 必然冲出边缘掉下去。
  #   这就是「改了逻辑却看不出效果」的原因：控制周期太粗，修复全被延迟淹没。
  #   提到 30 FPS 后每次决策只走 ~1.5px。
  #   ✅ 安全性：键盘是**按住**模式（key_down / key_up），提帧只会让掉头更及时，
  #      **不会**让角色走得更快。
  #   💡 CPU 吃紧就往下调，但别低于 20（低于 20 每次决策又要走 2px 以上）。
  fps_limit_main: 30                # 🚥 Main loop FPS – 主循环多快决策一次
  fps_limit_keyboard_controller: 30 # 🚥 Keyboard controller thread FPS
  # ⚠️ 截图是主循环的**上游**：15 FPS = 每 66ms 才刷新一次画面，主循环再快
  #    拿到的也是过期坐标。所以这里要跟着一起提。
  fps_limit_window_capturor: 30     # 🚥 Window capture thread FPS
  fps_limit_route_recorder: 10      # 🚥 Route recorder FPS
  language: "cn"                    # ⚙️ Options: "eng" "cn"

demo_record:
  # 🎬 手动示范录制（2026-10-14 加）—— 你自己玩，把「人怎么打」录成样本
  #
  # 为什么要它：引擎的「够得着」判据、攻击框大小、确认两次的节奏、爬梯让不让打
  #   —— 这些阈值到底是紧还是松，光看日志吵不出结论。人手动玩同样的画面时，
  #   引擎的感知与决策**照样在算**（`[怪检测]` 明细 + 影子决策 `cmd_*`），
  #   于是同一帧里"引擎想怎么打"和"人怎么打"可以逐帧对照 ⇒ 差集就是
  #   「逻辑哪里不对」的硬名单。
  #   离线分析：python -m tools.analyze_demo debug/demo/demo_*.jsonl.gz
  #
  # 怎么用（三步）：
  #   ① 主界面「🎥 示范录制」组框里勾上「开示范录制」（推荐，勾完自动存进配置；
  #      不想用界面也行 —— 把下面 enabled 改成 true，record_only 保持 true）
  #   ② 点界面「开始」——此时**引擎的键盘是静音的**（一个键都不发，日志会提示），
  #      你自己手动打怪 3~5 分钟（打怪、走位、爬梯、上下层都来一点）
  #   ③ 停掉，把 debug/demo/ 里的文件交给开发者 → 报告会给出
  #      「人出手时离怪多远 / 交叠多少 / 在不在梯子上」的分位数，
  #      以及「引擎想打而人没打」「人打了而引擎不想打」两类分歧清单。
  #
  # ⚠️ 只录游戏键（四个方向 + 你配的攻击/跳跃/拾取/喝药键）；其它按键只累加次数、
  #    **不记键名**（免得你在界面里打字被当成操作样本）。纯观测：关掉就零开销，
  #    出错只吼一次并自动关掉录制，绝不影响挂机。
  enabled: false                    # 🎬 总开关（默认关；要用才开）
  record_only: true                 # 🎬 true=键盘静音（你自己操作）；false=引擎照打（样本被污染）
  out_dir: "debug/demo"             # 🎬 落盘目录（每帧 1 行 JSONL；gzip 后约 20~40KB/分钟）
  record_keys: true                 # 🎬 录真人按键（按下/抬起事件 + 时间戳）
  every_n_frames: 1                 # 🎬 抽稀：2 = 每两帧一条（30fps ⇒ 15 条/秒）
  max_minutes: 30                   # 🎬 单个文件最多录多少分钟（到点自动换下一个）
  max_frames: 0                     # 🎬 单文件最多多少帧（0 = 只按分钟切）
  gzip: true                        # 🎬 true = 写 .jsonl.gz

name: CI

# 只在改动代码/资源时触发；纯文档改动不必跑
on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ master ]
  workflow_dispatch:      # 允许在 Actions 页面手动点一次

# 为什么用 windows-latest 而不是默认的 ubuntu：
#   本项目是 Windows 专属，src/utils/common.py 与 src/input/GameWindowCapturor.py
#   在**模块顶层**就 import 了 pywin32 / windows-capture，这些包在 Linux 上装不上，
#   任何 import 到 src 的脚本都会 ModuleNotFoundError。
#   GitHub 对公开仓库的 Windows runner 同样免费。
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须取全历史（含标签）。verify_make_patch 要用
          # `git diff --name-only v1.0.2..v1.0.3` 判断两个版本间
          # 依赖有没有变（依赖变了就不许发增量补丁）。
          # checkout 的默认 fetch-depth=1 只取最新一个 commit，
          # 标签都不在 → 那条自检会直接失败。
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查（全部源码与工具）
        run: python -m compileall -q src tools

      # 只跑「不依赖游戏窗口、不抓帧、不发按键」的离线自检。
      # 其余 verify_*.py 需要真实窗口/资源或会阻塞（input()），故不进 CI：
      #   verify_route            需要 tools.grab_frame 抓帧
      #   verify_home_route_health 需要真实资源跑 load_config
      #   verify_nametag_track     需要真机日志，且末尾有 input() 阻塞
      - name: 离线自检
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          # 自检进程的日志写 runner 的临时目录，别灌进仓库 log/（用户 m09283 拍板）。
          # 背景：`MSLogger()` 在 import 时就实例化 ⇒ 每个自检进程都会在 log/ 下
          #   新建一条日志；真机实测攒到 1300 个文件 / 15 MB，1201 个不到 10 KB。
          #   （引擎自己也能识别"工具进程"并写系统临时目录，这里显式指定更直白。）
          $env:MSBOT_LOG_DIR = Join-Path $env:RUNNER_TEMP 'msbot_logs'
          $tests = @(
            'verify_home_route',
            'verify_recorder_action',
            'verify_home_restore',
            # ★ 2026-10-14 补进清单：段号越界（`img_routes` 换了列表、`idx_routes`
            #   还停在旧值 → run_once 每帧 IndexError、角色彻底不动）。这个自检
            #   2026-10-12 就写了，但**一直没进 CI**，所以 2026-10-14 第二次真机
            #   停摆（累计失败 296 帧）没人拦 —— 判据没接线 = 判据不存在。
            'verify_route_index_bounds',
            'verify_jump_cooldown',
            # ★ 2026-10-13 加：修饰键（alt/ctrl/shift）当跳跃键 —— 真机事故是我
            #   `key.jump: alt`，录制时静默 0 个跳跃像素（详见该脚本头部注释）。
            'verify_jump_key_modifier',
            # ★ 2026-10-13 加：登记表删空不能留裸头部（`map_mobs_mapping:` 空段
            #   → yaml 解析成 None → 界面启动链上的 refresh_map_list 抛 TypeError
            #   → **窗口根本打不开**；真机两次启动失败日志）。
            'verify_registry_empty_block',
            'verify_mob_template_qa',
            # ★ 2026-10-13 加：怪检测的**前景色校验闸** + 巨型模板不再整帧作废。
            #   真机事故：contour_only 只看黑轮廓，沼泽地2 的留档帧（画面里只有 1 只
            #   鳄鱼）被认出 **17 个框，全压在平台植被上**；加闸后同一帧 = 1 个框，
            #   且那 1 个经放大核对**就是真的鳄鱼**。详见该脚本头部注释。
            'verify_mob_color_gate',
            # ★ 2026-10-13 加：精灵帧导入（黑底素材 → 绿幕 + 补 1px 黑描边 + 前缀命名）。
            #   两个静默失效点：文件名不带 `<怪名>_` 前缀 ⇒ 引擎 glob 一个都不加载；
            #   没有黑描边 ⇒ contour_only 的掩码是空的 ⇒ 一次都匹配不上。
            'verify_mob_frames_import',
            'verify_no_frame_reason',
            'verify_make_patch',
            'verify_pack_manifest',
            'verify_key_failure_visible',
            'verify_driver_precheck',
            'verify_home_none_no_crash',
            'verify_log_no_flood',
            'verify_bars_potions',
            'verify_capture_border_fallback',
            'verify_nametag_mode_fix',
            # ★ 2026-10-14 加：名字锚点**按地图存盘**（用户问「名字和称号都看不到时
            #   怎么定位角色」）。真机病根：名字认不到时引擎沿用上一帧位置，而
            #   **开局那几帧没有上一帧** ⇒ 位置停在 (0,0)、攻击框落到画面左上角，
            #   症状是"只走路不打怪"且一句错都不报。治法是命中时把锚点存到
            #   minimaps/<图>/nametag_pos.json，开局先读回来用。
            #   判据：fail-closed（坏文件/字段缺/画面外一律当没存过）+ fail-open
            #   （写盘失败不影响挂机、只吼一次）+ 5 秒节流（force 例外）+ 三处接线
            #   + 识别逻辑一行没改（匹配/阈值/切块兜底仍在）。
            'verify_nametag_pos_cache',
            # ★ 2026-10-14 加：名字定位「抗闪」——分数落在半峰（真机 0.0220~0.0240）时
            #   也采信，条件是候选角色位置离**上次严格命中**的锚点 <= relax_max_jump。
            #   病根：miss 计数涨过 stale_pos_full_frame_after（**2026-10-14 起默认 0
            #   = 关掉整帧放大**；当天曾依次试过 25 / 10，理由见 config_default.yaml）
            #   ⇒ 索敌框放大到**整帧**
            #   ⇒ 怪数虚高（真机 怪8~怪10）、去追画面外 550px 的目标（log 11-42-16 实证）。
            #   判据：纯函数真值表 + fail-closed 边界 + **已知假阳性档（0.033~0.047）仍拒绝**
            #   + 配置/中文名/界面登记 + 白盒（判据只调一次、放宽采信不更新锚点、不落盘）。
            'verify_nametag_relax',
            # ★ 2026-10-14 加：「没出招·归因」——画出来的框是**索敌框**（±330×±132）、
            #   出招只看**攻击框**（±170×±70）+ 交叠面积，两者差一圈；再加绳/梯让路与
            #   前台守卫，用户看到的就是"有框不打"（真机 log 12-05-06 实证：20 条怪>=1
            #   里 8 条在框外、6 条绳梯让路、只有 6 条真出招）。
            #   判据：纯函数 7 类真值表 + 前台**三态**（未知不许写成正常）+ 5s 节流与
            #   front 不消费节流 + 7 个调用点接线白盒 + 真机现场回归。
            'verify_mob_no_attack_log',
            # ★ 2026-10-14 加：丢名字时存画面（诊断埋点）。真机 12:43 那轮 4.6 分钟
            #   33 条名字告警却**一张画面都没有**，分不清"被裁/被挡/角色不在画面里/
            #   分数判错"。判据：配置+中文名+界面登记 / 存两张图的尺寸与三个标记的
            #   像素 / 5 秒节流 / miss_dump:false 即不写 / 无帧·无模板·目录不可写
            #   一律不抛异常且失败只吼一次 / 白盒（调用点在告警块内、纯观测不碰指令
            #   与存盘）/ stale_pos_full_frame_after 默认 0 的语义来源。
            'verify_nametag_miss_dump',
            # ★ 2026-10-14 加：`[怪检测]` 明细行 + `[出招·延迟]`（用户 m06852
            #   「记录下怪物的检测信息，现在的攻击还是不够灵敏」）。
            #   病根：`[运行状态]` 只有「怪N」—— 怪在哪、离攻击框差多少、
            #   引擎以为角色在哪全看不到；真机 17 条带数字的归因里中心离框
            #   多为「0px 水平 / 34~45px 垂直」（攻击框竖向只有 ±80）⇒ 眼睛
            #   看着"就在眼前"，引擎说够不着，而日志里没有任何一行能证明。
            #   判据：单只明细真值表（含斜向/非法输入）、整行四段与明细上限、
            #   节流两档（指纹变了 ≥1s 立刻打 / 否则 ≥5s）、`detect_log: false`
            #   关得掉、异常只吼一次、进框→出刀毫秒数（engage_n=0 不算）、
            #   判据名全文件只读一处、两口径在日志上必须看得出差别。
            'verify_detect_log',
            # ★ 2026-10-14 加：**手动示范录制**（用户 m07008「我自己操作，录下我的
            #   打怪行为，以此作为数据样本来优化逻辑」）。为什么值得做：引擎的
            #   "够得着"判据/攻击框大小/确认节奏/梯上让不让打，只有"人在同样画面上
            #   怎么做"能当参照物；继续猜阈值不如拿样本量一遍。
            #   接线白盒 + 抽稀/换文件/失败只吼一次 + 只录游戏键。
            #   判据：纯函数真值表 / frame_record 字段压缩 / 开关关掉即不写 /
            #   every_n_frames 抽稀 / max_frames·max_minutes 换文件且计数按文件归零 /
            #   无 pynput 降级 / KeyWatch 只认游戏键（其它键不记名只计数）/
            #   调用点在 on_frame 末尾（感知与影子决策都算完了）。
            'verify_demo_recorder',
            # ★ 2026-10-14 加：示范录制的**离线分析**（把"人怎么打"与"引擎怎么判"
            #   逐帧对照）。分歧三态（引擎没看见 / 判够不着 / 够得着却没出招）是
            #   调参数的线索面；延迟只在 engage 0→>0 起表、一次进框一个样本。
            #   判据：几何纯函数（含非法输入）/ frame_facts 最近怪按曼哈顿距离 /
            #   三态分类计数 / 延迟口径（离开框作废、不重复计数）/ 梯上·平台出手率 /
            #   报告七节都在且写明"感知不是真值、不自动改配置"/
            #   参数给了但文件不存在 ⇒ 非零退出（不拿空报告冒充成功）。
            'verify_demo_analyze',
            # ★ 2026-10-14 加：示范录制的**主界面控件**（🎥 组框）。同 verify_monster_ui
            #   的理由：高级设置页签 2026-09-12 移除后，`demo_record` 这组键界面
            #   没有任何入口 —— 用户想录一次只能让 AI 手改 yaml。
            #   "接线 ≠ 实现"：画出来却没接上（没挂布局 / 没灌值 / 没读回 /
            #   不在 _MANAGED_SECTIONS 里被磁盘旧值盖掉）都是静默失效。
            #   判据：真控件往返（灌值→改→读回，同段内部键一个不许丢）/
            #   缺段·清空·非数字的兜底 / 四处接线源码断言 / 界面兜底值 == 出厂默认值 /
            #   有控件的键不在 ADV_FIELD_HIDE 里且都有中文名。
            'verify_demo_ui',
            # ★ 2026-10-14 加：**梯上让路收紧**（用户 m08016 拍板 A，依据 = 示范录制）。
            #   背景：`is_on_ladder` 是一面只进不出的旗子 ⇒ 示范录制里梯上帧
            #   2749（43.9%）全被让路吃掉，其中 44/105 段整段全局 y 零变化
            #   （粘滞误判、人在这些帧里出手 910 次），引擎梯上出手率 0.0%。
            #   改动：`_ladder_yield()` 唯一判据点 + `route.ladder_still_s`（0.7s）；
            #   判据不可用（配置≤0 / 全局坐标读不到）⇒ fail-closed 退回老行为。
            #   判据：真值表（缺键·None·畸形·0·负数·>30·坐标缺失）/
            #   三路让路逻辑与"为什么"文案 / 让路块只问一次且老判据已删 /
            #   竖向进展戳唯一喂点且只认全局 y / 不改旗标本身 /
            #   配置与界面口径 / **真机样本回放**（老规则 2749 → 新规则 1397，50.8%）。
            'verify_ladder_yield',
            # ★ 2026-10-14 加：**宽判定余量**（`monster_detect.mob_engage_margin`，
            #   用户 m08016 拍板 B，依据 = 示范录制 389 帧「看见了却判够不着」里
            #   69% 只差单轴 ≤ 45px；用户 m06810 原话"人只能预估，属于宽判定"）。
            #   判据：`_engage_margin()` 真值表（缺键⇒40 / None⇒40 / 0⇒0 /
            #   200⇒200 / 201⇒0 / -1⇒0 / "40"⇒40 / "abc"⇒0 / 整段缺失⇒40）/
            #   `_attack_boxes()` 外扩几何（aoe 一框、directional 两框各自外扩、
            #   m=0 时与 get_attack_range 逐字节一致）/ 三个消费点（判定·观测·
            #   明细行）走同一个框且不再直接调 get_attack_range /
            #   中心差 30px 的怪 m=0 不算·m=40 算·差 100px 仍不算 /
            #   界面控件往返 + 非法输入保留原值 + 不在 ADV_FIELD_HIDE 里 /
            #   明细行 margin=0 不提、margin=40 写明"屏幕上的框没变"。
            'verify_engage_margin',
            # ★ 2026-10-14 加：**绳梯脚下「蹭一下」自救**（`route.rope_nudge_*`，
            #   用户 m08620 拍板 D，回应 m08454「有卡楼梯和偏离路线后站着不动」）。
            #   由来：真机 15:16:40→15:17:25 停在 全局(78,78)、15:32:22→15:33:05
            #   停在 (76,78)，按着 up 45~50s 不动，而 `[按键状态]` 说键一直在发；
            #   机制是自锁（1px 绳列 + 横向补位只在 is_on_ladder 为真时加，而旗标
            #   要"纵向真动过"才置真）。对照：同一份示范录制里真人站 x=78 只按 up
            #   就爬上去了、机器人本轮 65 次成功上爬里常见 `left up none`。
            #   判据：`_rope_nudge_cfg()` 真值表（缺键/None/字符串/关掉/负数/畸形/
            #   NaN/越界）/ `_rope_nudge_dir()` 真值表（非上下·在梯上·关掉·戳未初始化
            #   ·未到阈值·朝列走·列上左右交替·放弃时刻恰为 start+max·max=0 永不放弃
            #   ·down 同样适用）/ 接线白盒（只调一次、is_on_ladder 原支保留、
            #   `[绳梯自救]` 留痕含关掉方式、1.5s 节流）/ 配置与界面口径 /
            #   `[路线失联]` 文案修正（不再打锚点自距的「距离 0px」）/
            #   **真机样本回放**（15:07 那轮 384 个状态采样：可蹭期 68 个窗口全部
            #   蹭了、左右都出现、真在爬的 1875 帧一帧都没蹭）。
            'verify_rope_nudge',
            # ★ 2026-10-14 加：**goal 像素不再吃掉整帧**（`route.goal_pixel_skip`，
            #   用户 m08867 拍板 E1，回应 m08737「读取日志，查看导航问题」）。
            #   由来：真机 15:59:34→16:05:07（**5.5 分钟**）角色站在本段终点
            #   **正下方 8px**（全局 (48,86)、段3/4），每帧指令都是 `none none goal`
            #   —— 它离本段 goal 圆点最近（`route.search_range`(10) 是**方框半边**
            #   且代码没有 `dist <= radius`，曼哈顿 16px 也命中），而 goal 的命令是
            #   "什么都不做"；同时 `check_reach_goal()` 因 `|86-78| = 8 >
            #   goal_reach_y_tol(3)` 拒绝切段 ⇒「命令不让动 + 段不让切」= 冻死；
            #   更要命的是**回正线进不来**（回正门槛是"一个路线像素都找不到"）。
            #   最后用户手动停机；停机后他手绘回正线，16:21:06 那条
            #   `[回正·小结] 成功回主线 | 1.9s/56帧 | (76,86)→(68,78)`
            #   ⇒ 只要回正进得去，1.9 秒就能回到主线。
            #   同一日志里 `指令(none none goal)` 的连续段 25 段、最长 5.5 分钟
            #   （上一轮 9 段、最长 76 秒）。
            #   判据：`_goal_pixel_skip_params()` 真值表（关掉/畸形/None/
            #   `goal_reach_y_tol=0`/拿不到本段终点 y ⇒ 一律**不启用**=退回老行为）/
            #   `_route_hit_unusable()` 真值表（goal 高度差闭区间、另一层的纯横向
            #   像素、up·down·jump·teleport 一律放行）/ 接线白盒（三处扫描都过滤、
            #   唯一读点、`[路线·goal过滤]` 留痕含关掉方式）/ 配置与界面口径 /
            #   端到端（真 `get_nearest_color_code()`：现场判成"没有可用像素"
            #   ⇒ 回正接管；`goal_pixel_skip=0` 退回老行为；真到位时照旧切段）/
            #   **真机日志回放**（真 `route*.png`：老判据拿到 goal 的 13 帧，
            #   新判据 **0 帧**，其中 137 帧改判成"没有可用像素"）。
            'verify_goal_pixel_skip',
            # ★ 2026-10-14 加：`[出招]` 心跳（用户反馈 m06529「攻击就是很慢」）。
            #   为什么必须计数而不是采样：attack 指令只存在**一帧**，下一帧就被残留
            #   清理清掉 ⇒ 按 5 秒采样看到的永远是 0 条 attack（真机 92 条样本实证）。
            #   判据：计数/间隔口径（首刀与 ≥30s 的跨场景间隔都不进平均）+ 文案必须
            #   点出「设定冷却就是限速器」还是「时间花在没怪/走过去/爬梯」+ 4 处出招
            #   接线白盒 + finally 清零（含失败路径）+ 纯观测（不碰指令、不改节流）。
            'verify_attack_log',
            'verify_goal_unreachable_warn',
            'verify_attack_box_stale_pos',
            'verify_two_side_mob_attack',
            # ★ 2026-10-13 加：巡逻中「停下来打怪」（用户要求：检测到怪 → 打完再走，
            #   不要在移动中穿插着攻击）。判据：有怪站定并清零走位 / 连续检测帧框内为空
            #   才算打完 / 两条安全阀必须留 WARNING / 回正期间不参与 / 顺序白盒。
            'verify_stop_to_attack',
